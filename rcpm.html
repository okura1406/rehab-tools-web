<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>日本版レーヴン色彩マトリックス検査（RCPM）</title>
<!-- ▼ ウェブ公開・オフライン対応のための追記（採点ロジックには影響しません） -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RCPM">
<!-- ▲ 追記ここまで -->
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --border:#d8dee4;
  --text:#222; --muted:#6b7280;
  --accent:#2563eb; --accent-light:#dbeafe;
  --warn:#d97706; --danger:#dc2626; --ok:#059669;
  --section:#eff3f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  line-height:1.5;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0 0 10px;padding:10px 12px;background:var(--accent);color:#fff;border-radius:6px}
h2{font-size:16px;margin:18px 0 8px;padding:8px 10px;background:#1f2937;color:#fff;border-radius:4px}
h3{font-size:15px;margin:14px 0 6px;padding:6px 10px;background:var(--section);border-left:4px solid var(--accent);border-radius:2px}

.patient-bar{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.patient-bar label{font-weight:bold;white-space:nowrap}
.patient-bar input{flex:1;min-width:120px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:15px}
.patient-bar input[type="number"]{max-width:80px}

/* タブ帯は画面の上に固定する（下までスクロールしてもタブを押せるようにするため）。
   タブは折り返さず横1列にして、入りきらない場合は横スクロールで送る */
.tabs{display:flex;flex-wrap:nowrap;gap:4px;border-bottom:2px solid var(--accent);margin-bottom:10px;
  position:sticky;top:0;z-index:50;background:var(--bg);padding-top:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;white-space:nowrap;padding:8px 14px;border:1px solid var(--border);border-bottom:none;
  background:#e5e7eb;cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;font-weight:bold}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-panel{display:none;background:var(--panel);border:1px solid var(--border);
  border-top:none;border-radius:0 0 6px 6px;padding:12px}
.tab-panel.active{display:block}

/* 問題カード */
.q-card{border:1px solid var(--border);border-radius:5px;padding:8px 10px;margin-bottom:8px;
  background:#fafbfc;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-card.unanswered{background:#fff7ed;border-color:#f59e0b}
.q-num{font-weight:bold;font-size:15px;min-width:36px;color:#1f2937}

/* 選択ボタン */
.options{display:flex;flex-wrap:wrap;gap:5px}
.opt{padding:6px 12px;border:2px solid var(--border);border-radius:4px;
  background:#fff;cursor:pointer;font-size:14px;user-select:none;transition:all .15s;
  min-width:38px;text-align:center;font-weight:normal;position:relative}
.opt:hover{border-color:var(--accent);background:var(--accent-light)}
/* 正答ボタン：緑の太枠 */
.opt.is-correct{border-color:var(--ok);border-width:2px;background:#f0fdf4;font-weight:bold}
/* 正解選択 */
.opt.is-correct.selected{background:var(--ok);color:#fff;border-color:var(--ok)}
/* 誤答選択 */
.opt.selected.wrong{background:var(--danger);color:#fff;border-color:var(--danger)}

/* 正答ラベル */
.correct-label{font-size:12px;color:var(--ok);font-weight:bold;white-space:nowrap}

/* 正誤バッジ */
.badge{padding:3px 10px;border-radius:12px;font-size:13px;font-weight:bold;white-space:nowrap;margin-left:auto}
.badge.ok{background:var(--ok);color:#fff}
.badge.ng{background:var(--danger);color:#fff}
.badge.pending{background:#9ca3af;color:#fff}

/* 所要時間 */
.time-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.time-row label{font-size:14px;color:var(--muted)}
.time-row input{width:64px;padding:5px;border:1px solid var(--border);border-radius:4px;font-size:14px;text-align:center}

/* スコアバー */
.score-bar{margin-top:12px;padding:10px;background:var(--accent-light);border-radius:6px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px}
.score-pill{background:#fff;padding:4px 14px;border-radius:12px;border:1px solid var(--accent);font-weight:bold;font-size:15px}

/* サマリーテーブル */
.summary-table{width:100%;border-collapse:collapse;margin-top:8px}
.summary-table th,.summary-table td{border:1px solid var(--border);padding:7px 10px;font-size:14px;text-align:center}
.summary-table th{background:var(--section);font-weight:bold}
.summary-table .total-row{background:var(--accent-light);font-weight:bold}

/* ボタン */
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.btn{padding:8px 14px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-reset{background:#e5e7eb;color:#111}
.btn-copy{background:var(--ok);color:#fff}

/* QR */
.qr-area{margin-top:14px;padding:12px;background:#f9fafb;border:1px solid var(--border);border-radius:6px}
.qr-canvas{background:#fff;display:inline-block;padding:8px;border:1px solid var(--border)}
.qr-text{margin-top:10px;padding:8px;background:#fff;border:1px solid var(--border);
  border-radius:4px;white-space:pre-wrap;font-family:monospace;font-size:12px;max-height:300px;overflow:auto}

.footer-note{font-size:11px;color:var(--muted);margin-top:20px;text-align:center;padding-bottom:20px}

/* 下書き自動保存の確認バナー（ベース仕様書 7-3） */
.draft-banner{background:#fff7ed;border:1px solid var(--warn);border-radius:6px;padding:10px;margin-bottom:10px}
.db-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.db-row:last-child{margin-bottom:0}
.db-msg{font-size:13px;color:#92400e;flex:1;min-width:180px}
.patient-note{font-size:12px;color:var(--muted);width:100%}
.stop-warn{background:#fef3c7;border:1px solid var(--warn);color:#92400e;border-radius:6px;
  padding:8px 10px;margin-top:10px;font-size:13px;font-weight:bold}
</style>
</head>

/* ============================================================
   正答データ（採点用紙の太字数字より読取）
   インデックス 0 = 問1, ..., 11 = 問12
   ============================================================ */
const CORRECT_ANSWERS = {
  A:  [4, 5, 1, 2, 6, 3, 6, 2, 1, 3, 4, 5],
  AB: [4, 5, 1, 6, 2, 1, 3, 4, 6, 3, 5, 2],
  B:  [2, 6, 1, 2, 1, 3, 5, 6, 4, 3, 4, 5]
};

/* ============================================================
   STATE
   ============================================================ */
const SETS = ['A','AB','B'];
const Q_COUNT = 12;

function initSetData(){
  const d={};
  SETS.forEach(s=>{d[s]={answer:Array(Q_COUNT).fill(null),timeMin:'',timeSec:''};});
  return d;
}

const STATE = {
  patientName:'', age:'', examDate:'',
  sets: initSetData()
};

/* ============================================================
   採点
   ============================================================ */
function getScore(setKey){
  const s=STATE.sets[setKey], correct=CORRECT_ANSWERS[setKey];
  let score=0;
  for(let i=0;i<Q_COUNT;i++) if(s.answer[i]!==null&&s.answer[i]===correct[i]) score++;
  return {score, max:Q_COUNT, answered:s.answer.filter(a=>a!==null).length};
}
function getTotalScore(){return SETS.reduce((t,s)=>t+getScore(s).score,0);}
function unansweredCount(){return SETS.reduce((t,s)=>t+(Q_COUNT-getScore(s).answered),0);}

/* ============================================================
   UIヘルパー
   ============================================================ */
function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;
}
function bindNumInput(input,onSet,nextId){
  input.addEventListener('input',e=>{onSet(e.target.value);});
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();render();
      if(nextId){setTimeout(()=>{const n=document.getElementById(nextId);if(n){n.focus();try{n.select();}catch(err){}}},0);}
    }
  });
  input.addEventListener('blur',()=>{render();});
}

/* ============================================================
   タブ定義
   ============================================================ */
const TABS=[
  {id:'setA',   title:'セットA',   render:p=>renderSetTab(p,'A')},
  {id:'setAB',  title:'セットAB',  render:p=>renderSetTab(p,'AB')},
  {id:'setB',   title:'セットB',   render:p=>renderSetTab(p,'B')},
  {id:'result', title:'結果・QR', render:renderResultTab},
];
let activeTab='setA';

/* 横スクロールするタブ帯で、選んでいるタブが画面の外に隠れないよう横方向に寄せる。
   block:'nearest' を指定して、ページの縦位置は動かさない */
function scrollActiveTabIntoView(bar){
  const act=bar.querySelector('.tab-btn.active');
  if(!act||!act.scrollIntoView)return;
  try{ act.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
}

/* ============================================================
   render
   ============================================================ */
function render(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  TABS.forEach(t=>{
    const b=el('div','tab-btn'+(activeTab===t.id?' active':''),t.title);
    b.onclick=()=>{activeTab=t.id;render();window.scrollTo(0,0);};
    tabs.appendChild(b);
  });
  scrollActiveTabIntoView(tabs);
  const panels=document.getElementById('panels');
  panels.innerHTML='';
  const panel=el('div','tab-panel active');

  // 患者情報バー
  const pb=el('div','patient-bar');
  const lbl=el('label',null,'患者氏名：');
  const inp=document.createElement('input');inp.type='text';inp.value=STATE.patientName;
  inp.oninput=e=>{STATE.patientName=e.target.value;};
  pb.appendChild(lbl);pb.appendChild(inp);
  const ageL=el('label',null,'年齢：');
  const ageI=document.createElement('input');ageI.type='number';ageI.value=STATE.age;ageI.style.maxWidth='70px';
  ageI.oninput=e=>{STATE.age=e.target.value;};
  pb.appendChild(ageL);pb.appendChild(ageI);pb.appendChild(el('span','','歳'));
  const dateL=el('label',null,'検査日：');
  const dateI=document.createElement('input');dateI.type='date';dateI.value=STATE.examDate;dateI.style.maxWidth='150px';
  dateI.oninput=e=>{STATE.examDate=e.target.value;};
  pb.appendChild(dateL);pb.appendChild(dateI);
  pb.appendChild(el('div','patient-note','※ 氏名はQRコードには含まれません。画面表示のみに使用します。この端末に下書きとして一時保存されるため、カルテ転記が完了したらQR生成後に表示される消去ボタン、または全リセットで消去してください。'));
  panel.appendChild(pb);

  TABS.find(t=>t.id===activeTab).render(panel);

  if(activeTab!=='result'){
    const br=el('div','btn-row');
    const rb=el('button','btn btn-reset','このタブをリセット');
    rb.onclick=()=>{if(confirm('このセットの回答をリセットしますか？')){resetCurrentTab();render();}};
    br.appendChild(rb);
    const ra=el('button','btn btn-reset','全リセット');
    ra.onclick=()=>{if(confirm('すべての回答をリセットしますか？')){resetAll();render();}};
    br.appendChild(ra);
    panel.appendChild(br);
  }
  panels.appendChild(panel);
}

/* ============================================================
   セットタブ描画
   ============================================================ */
function renderSetTab(panel, setKey){
  panel.appendChild(el('h2','','セット'+setKey));
  const s=STATE.sets[setKey], correct=CORRECT_ANSWERS[setKey];

  for(let i=0;i<Q_COUNT;i++){
    const ans=s.answer[i], corr=correct[i];
    const isAnswered=ans!==null;
    const card=el('div','q-card'+(isAnswered?'':' unanswered'));
    card.appendChild(el('div','q-num','問'+(i+1)));

    // 選択ボタン 1〜6
    const opts=el('div','options');
    for(let v=1;v<=6;v++){
      const isCorr=(v===corr), isSel=(ans===v);
      let cls='opt';
      if(isCorr) cls+=' is-correct';
      if(isSel && isCorr)  cls+=' selected';        // 正解
      else if(isSel && !isCorr) cls+=' selected wrong'; // 誤答
      const b=el('div',cls,String(v));
      b.onclick=(function(val){return function(){
        s.answer[i]=(s.answer[i]===val?null:val); render();
      };})(v);
      opts.appendChild(b);
    }
    card.appendChild(opts);

    // 正答ラベル（常時表示）
    card.appendChild(el('span','correct-label','正答：'+corr));

    // 正誤バッジ
    const badge=el('span','badge '+(isAnswered?(ans===corr?'ok':'ng'):'pending'),
                   isAnswered?(ans===corr?'○':'✕'):'—');
    card.appendChild(badge);
    panel.appendChild(card);
  }

  // 所要時間（分・秒 自由入力）
  const timeDiv=el('div','time-row');
  timeDiv.appendChild(el('label','','所要時間：'));
  const tMin=document.createElement('input');tMin.type='number';tMin.id='tmin-'+setKey;
  tMin.value=s.timeMin;tMin.placeholder='分';tMin.style.cssText='width:64px;text-align:center';
  tMin.min='0';
  tMin.addEventListener('input',e=>{s.timeMin=e.target.value;});
  tMin.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();
      const n=document.getElementById('tsec-'+setKey);
      if(n){n.focus();try{n.select();}catch(err){}}
    }
  });
  tMin.addEventListener('blur',()=>{render();});
  timeDiv.appendChild(tMin);
  timeDiv.appendChild(el('span','','分'));
  const tSec=document.createElement('input');tSec.type='number';tSec.id='tsec-'+setKey;
  tSec.value=s.timeSec;tSec.placeholder='秒';tSec.style.cssText='width:64px;text-align:center';
  tSec.min='0';tSec.max='59';
  tSec.addEventListener('input',e=>{s.timeSec=e.target.value;});
  tSec.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();render();
      const tabOrder=['setA','setAB','setB','result'];
      const cur=tabOrder.indexOf(activeTab);
      if(cur>=0&&cur<tabOrder.length-1){
        activeTab=tabOrder[cur+1];render();window.scrollTo(0,0);
      }
    }
  });
  tSec.addEventListener('blur',()=>{render();});
  timeDiv.appendChild(tSec);
  timeDiv.appendChild(el('span','','秒'));
  panel.appendChild(timeDiv);

  // スコアバー
  const r=getScore(setKey);
  const sb=el('div','score-bar');
  sb.appendChild(el('span','','回答済み：'+r.answered+' / '+Q_COUNT+'問'));
  sb.appendChild(el('span','score-pill','得点：'+r.score+' / '+r.max));
  panel.appendChild(sb);
}

/* ============================================================
   結果タブ
   ============================================================ */
function renderResultTab(panel){
  panel.appendChild(el('h2','','結果サマリー・QRコード'));

  const tbl=document.createElement('table');tbl.className='summary-table';
  const thead=document.createElement('thead');
  const hr=document.createElement('tr');
  ['セット','得点','回答済み'].forEach(h=>{
    const th=document.createElement('th');th.textContent=h;hr.appendChild(th);
  });
  thead.appendChild(hr);tbl.appendChild(thead);
  const tbody=document.createElement('tbody');
  SETS.forEach(sk=>{
    const s=STATE.sets[sk], r=getScore(sk);
    const tr=document.createElement('tr');
    ['セット'+sk, r.score+' / '+r.max, r.answered+' / '+Q_COUNT].forEach(txt=>{
      const td=document.createElement('td');td.textContent=txt;tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const tr2=document.createElement('tr');tr2.className='total-row';
  ['合計', getTotalScore()+' / 36', ''].forEach(txt=>{
    const td=document.createElement('td');td.textContent=txt;tr2.appendChild(td);
  });
  tbody.appendChild(tr2);tbl.appendChild(tbody);
  panel.appendChild(tbl);

  // 総所要時間（自動計算）
  const totSec=SETS.reduce((acc,sk)=>{
    const ss=STATE.sets[sk];
    const m=parseInt(ss.timeMin)||0, s=parseInt(ss.timeSec)||0;
    return acc+(m*60+s);
  },0);
  const allEntered=SETS.every(sk=>STATE.sets[sk].timeMin!==''||STATE.sets[sk].timeSec!=='');
  const totM=Math.floor(totSec/60), totS=totSec%60;
  const totStr=allEntered?(totM+'分'+String(totS).padStart(2,'0')+'秒'):'—';
  const totTimeDiv=el('div','time-row');
  totTimeDiv.appendChild(el('label','','総所要時間：'));
  totTimeDiv.appendChild(el('span','score-pill',totStr));
  panel.appendChild(totTimeDiv);

  // 未回答の警告（ベース仕様書 5章。生成はブロックしない）
  const un=unansweredCount();
  if(un>0){
    const w=el('div','stop-warn','⚠ 未回答が '+un+' 問あります（0点として計算していません）。このままQRを生成することもできます。');
    panel.appendChild(w);
  }

  const btnRow=el('div','btn-row');
  const genBtn=el('button','btn btn-primary','QRコードを生成');
  genBtn.onclick=()=>generateQR();
  btnRow.appendChild(genBtn);
  const resetBtn=el('button','btn btn-reset','全リセット');
  resetBtn.onclick=()=>{if(confirm('すべての回答をリセットしますか？')){resetAll();render();}};
  btnRow.appendChild(resetBtn);
  panel.appendChild(btnRow);

  const qrArea=el('div','qr-area');qrArea.id='qr-area';qrArea.style.display='none';
  const qrRow=el('div','');qrRow.style.cssText='display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start';
  const qrCanvas=el('div','qr-canvas');qrCanvas.id='qr-canvas-1';
  const qrRight=el('div','');qrRight.style.cssText='flex:1;min-width:240px';
  const qrPre=el('pre','qr-text');qrPre.id='qr-text-1';qrPre.style.marginTop='0';
  const qrCopyBtn=el('button','btn btn-copy','テキストをコピー');qrCopyBtn.id='qr-copy-1';qrCopyBtn.style.marginTop='6px';
  qrRight.appendChild(qrPre);qrRight.appendChild(qrCopyBtn);
  qrRow.appendChild(qrCanvas);qrRow.appendChild(qrRight);
  qrArea.appendChild(qrRow);
  panel.appendChild(qrArea);

  // QR生成後に表示する下書き消去ボタン（ベース仕様書 7-4）
  const clearRow=el('div','btn-row');clearRow.id='draft-clear-row';clearRow.style.display='none';
  const clearBtn=el('button','btn btn-reset','入力データを消去する');
  clearBtn.onclick=()=>requestClearDraft(clearBtn);
  clearRow.appendChild(clearBtn);
  clearRow.appendChild(el('span','db-msg','※ カルテ転記が終わったら押してください。表示中のQR・テキストはそのまま確認できます。'));
  panel.appendChild(clearRow);

  panel.appendChild(el('h3','','プレビュー'));
  const preview=el('pre','qr-text');preview.textContent=buildQRText();
  panel.appendChild(preview);
}

/* ============================================================
   QRテキスト生成
   ============================================================ */
/* QRの中身は「1行1項目」で出力する（ベース仕様書 6-2-1）。
   読み取り先で改行が保たれるよう、改行コードは CRLF に揃える */
function toCRLF(raw){ return raw.replace(/\r\n/g,'\n').replace(/\n/g,'\r\n'); }
function getTimeStr(sk){
  const s=STATE.sets[sk];
  const m=parseInt(s.timeMin)||0, sec=parseInt(s.timeSec)||0;
  if(s.timeMin===''&&s.timeSec==='') return '—';
  return m+'分'+String(sec).padStart(2,'0')+'秒';
}
function getTotalTimeStr(){
  const allEntered=SETS.every(sk=>STATE.sets[sk].timeMin!==''||STATE.sets[sk].timeSec!=='');
  if(!allEntered) return '—';
  const totSec=SETS.reduce((acc,sk)=>{
    const ss=STATE.sets[sk];
    return acc+(parseInt(ss.timeMin)||0)*60+(parseInt(ss.timeSec)||0);
  },0);
  return Math.floor(totSec/60)+'分'+String(totSec%60).padStart(2,'0')+'秒';
}
/* 項目数が少ないため QR は1枚にまとめる（ベース仕様書 6-2） */
function buildQRText(){
  const lines=[];
  lines.push('◆レーヴン色彩マトリックス検査(RCPM)');
  SETS.forEach(sk=>{
    const r=getScore(sk);
    lines.push('【セット'+sk+'】'+r.score+' / '+r.max+'点');
  });
  lines.push('【総計】'+getTotalScore()+' / 36点');
  lines.push('総所要時間：'+getTotalTimeStr());
  const un=unansweredCount();
  if(un>0) lines.push('※未回答 '+un+'問（0点として計算していません）');
  return lines.join('\n');
}

function generateQR(){
  const text=toCRLF(buildQRText());
  const qrArea=document.getElementById('qr-area');
  if(!qrArea){render();return;}
  const textEl=document.getElementById('qr-text-1');
  if(textEl) textEl.textContent=text;
  const canvas=document.getElementById('qr-canvas-1');
  if(canvas){
    canvas.innerHTML='';
    try{
      const qr=qrcode(0,'M');qr.addData(text);qr.make();
      canvas.innerHTML=qr.createSvgTag(3,4);
    }catch(e){
      canvas.innerHTML='<div style="color:red;padding:10px">QR生成エラー: '+e.message+'</div>';
    }
  }
  const copyBtn=document.getElementById('qr-copy-1');
  if(copyBtn){
    copyBtn.onclick=()=>{
      navigator.clipboard.writeText(text).then(()=>{
        copyBtn.textContent='コピーしました ✓';
        setTimeout(()=>{copyBtn.textContent='テキストをコピー';},2000);
      },()=>{
        const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
        try{document.execCommand('copy');copyBtn.textContent='コピーしました ✓';}catch(e){}
        document.body.removeChild(ta);setTimeout(()=>{copyBtn.textContent='テキストをコピー';},2000);
      });
    };
  }
  qrArea.style.display='block';
  // 下書き消去ボタンを表示する（QR生成だけでは自動消去しない：ベース仕様書 7-4）
  const clearRow=document.getElementById('draft-clear-row');
  if(clearRow)clearRow.style.display='';
  try{qrArea.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
}

/* ============================================================
   リセット
   ============================================================ */
function resetAll(){
  STATE.patientName='';STATE.age='';STATE.examDate='';STATE.sets=initSetData();
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);   // 全リセットでは下書きも消す（ベース仕様書 8章）
}
function resetCurrentTab(){
  if(activeTab==='setA') resetSet('A');
  else if(activeTab==='setAB') resetSet('AB');
  else if(activeTab==='setB') resetSet('B');
}
function resetSet(sk){STATE.sets[sk]={answer:Array(Q_COUNT).fill(null),timeMin:'',timeSec:''};}

/* ============================================================
   下書き自動保存・復元（ベース仕様書 7章）
   - localStorage に独立した2スロット（A/B）を持つ。1タブ＝1スロット
   - sessionStorage・Cookie・外部送信は使用しない
   - 既存の下書きは自動復元せず、確認バナーで検査者に選ばせる
   - 消去は「QR生成後の消去ボタン」または「全リセット」のときだけ
   ============================================================ */
var SLOT_KEYS={A:'rcpmSave_slotA',B:'rcpmSave_slotB'};
var mySlot=null;          // このタブが書き込むスロット。決まるまでnull
var saveTimer=null;
var EMPTY_SNAPSHOT=JSON.stringify(STATE);   // 未入力状態の控え（空のまま保存しないため）

function readSlot(s){
  try{
    var raw=localStorage.getItem(SLOT_KEYS[s]);
    if(!raw)return null;
    var d=JSON.parse(raw);
    return (d&&d.s)?d:null;
  }catch(e){ return null; }
}
function writeSlot(s,d){ try{ localStorage.setItem(SLOT_KEYS[s],JSON.stringify(d)); }catch(e){} }
function clearSlot(s){ try{ localStorage.removeItem(SLOT_KEYS[s]); }catch(e){} }
function hasAnyInput(){ return JSON.stringify(STATE)!==EMPTY_SNAPSHOT; }

/* 入力のたびに呼ばれる。連続入力で書き込みが増えないよう400ms待ってからまとめて保存する */
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,400); }
function saveDraft(){
  if(!mySlot)return;                                  // スロット未確定（両方に下書きあり）の間は保存しない
  if(!hasAnyInput()){ clearSlot(mySlot); return; }     // 全部空なら下書きも残さない
  writeSlot(mySlot,{v:1,n:STATE.patientName,t:Date.now(),s:STATE});
}

/* 保存内容をSTATEへ書き戻す。STATE側にあるキーだけを上書きするので、
   古い版の下書きを読んでも新しい項目が消えない */
function mergeInto(dst,src){
  if(!src||typeof src!=='object')return;
  var keys=Object.keys(dst).length?Object.keys(dst):Object.keys(src);
  keys.forEach(function(k){
    var sv=src[k];
    if(sv===undefined)return;
    if(dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k])&&sv&&typeof sv==='object'&&!Array.isArray(sv)){
      mergeInto(dst[k],sv);
    }else{
      dst[k]=sv;
    }
  });
}

function fmtDraftTime(ts){
  var d=new Date(ts);
  function p(n){ return n<10?'0'+n:''+n; }
  return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function refreshDraftBanner(){
  var dA=readSlot('A'), dB=readSlot('B');
  if(!dA&&!dB){ hideDraftBanner(); if(!mySlot)mySlot='A'; return; }
  if(dA&&dB){ mySlot=null; showDraftBanner(dA,dB); return; }   // 空きなし：選ぶまで保存を保留
  mySlot=dA?'B':'A';                                           // 空いている方を暫定的に使う
  showDraftBanner(dA,dB);
}
function draftRow(slot,d){
  var row=el('div','db-row');
  row.appendChild(el('span','db-msg','保存されている入力があります（氏名：'+(d.n||'（未入力）')+'　最終更新：'+fmtDraftTime(d.t)+'）'));
  var go=el('button','btn btn-primary','続きから再開');
  go.onclick=function(){ resumeSlot(slot); };
  row.appendChild(go);
  var del=el('button','btn btn-reset','この下書きを削除');
  del.onclick=function(){
    if(!confirm('保存されている下書き（氏名：'+(d.n||'（未入力）')+'）を削除します。よろしいですか？'))return;
    clearSlot(slot); mySlot=null; refreshDraftBanner();
  };
  row.appendChild(del);
  return row;
}
function showDraftBanner(dA,dB){
  var box=document.getElementById('draftBanner');
  if(!box)return;
  box.innerHTML='';
  var wrap=el('div','draft-banner');
  wrap.appendChild(el('div','db-msg','自動では復元しません。続きから再開するか、削除するかを選んでください。'));
  if(dA)wrap.appendChild(draftRow('A',dA));
  if(dB)wrap.appendChild(draftRow('B',dB));
  var foot=el('div','db-row');
  if(mySlot){
    // 空きスロットがある場合のみ（仕様書 7-3）。既存の下書きには触れずにバナーを閉じる
    foot.appendChild(el('span','db-msg','この下書きを残したまま、別の患者の入力を始める場合：'));
    var keep=el('button','btn btn-reset','下書きは残して新規入力');
    keep.onclick=function(){ hideDraftBanner(); };
    foot.appendChild(keep);
  }
  if(dA&&dB){
    var both=el('button','btn btn-reset','両方とも破棄して新規入力');
    both.onclick=function(){
      if(!confirm('両方の下書きを破棄して新規入力にします。よろしいですか？'))return;
      clearSlot('A'); clearSlot('B'); mySlot=null; refreshDraftBanner();
    };
    foot.appendChild(both);
  }
  if(foot.childNodes.length)wrap.appendChild(foot);
  box.appendChild(wrap);
}
function hideDraftBanner(){
  var box=document.getElementById('draftBanner');
  if(box)box.innerHTML='';
}
function resumeSlot(slot){
  var d=readSlot(slot);
  if(!d)return;
  mergeInto(STATE,d.s);
  mySlot=slot;
  hideDraftBanner();
  activeTab='setA';
  render();
}
function requestClearDraft(btn){
  if(!confirm('この端末に一時保存されている入力データ（下書き）を消去しますか？\n※表示中のQRコード・テキストはそのまま確認できます。'))return;
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);
  if(btn){ btn.disabled=true; btn.textContent='消去しました'; }
}

/* ============================================================
   初期化
   ============================================================ */
render();
refreshDraftBanner();
// 文字・数値の入力を拾う（選択ボタンは render() 経由で拾う）
document.addEventListener('input',scheduleSave,false);
// 選択肢を押すたびに render() が呼ばれるので、そこに保存処理を足す
render=(function(orig){ return function(){ orig.apply(null,arguments); scheduleSave(); }; })(render);
</script>
<script>
/* オフライン動作（Service Worker）の登録。
   登録に失敗しても catch で握りつぶすため、ツール本体の動作には影響しません。 */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;--sf:#fff;--sf2:#fafaf7;
  --tx:#1a1a1a;--tx2:#555;--tx3:#999;
  --bd:#e0ddd5;--bd2:#eeece6;
  --pr:#2563eb;--pr2:#dbeafe;--pr3:#1d4ed8;
  --gn:#16a34a;--gn2:#dcfce7;
  --yw:#ca8a04;--yw2:#fef9c3;
  --rd:#dc2626;--rd2:#fee2e2;
  --or:#ea580c;--or2:#ffedd5;
  --r:10px;--sh:0 1px 4px rgba(0,0,0,.07);
  --f:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo','Noto Sans JP',sans-serif;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--tx);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;font-family:var(--f)}
input,textarea{font-family:var(--f)}
.hd{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hd h1{font-size:1.05rem;font-weight:700;text-align:center;letter-spacing:.02em}
/* タブ帯はヘッダーのすぐ下に固定する。top は実際のヘッダーの高さ（--hdH）に合わせる。
   固定値にすると、画面が狭くてヘッダーの文字が折り返したときにタブが隠れてしまうため */
.tabs{display:flex;background:var(--sf);border-bottom:2px solid var(--bd);padding:0 8px;position:sticky;top:var(--hdH,49px);z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 16px;font-size:.82rem;font-weight:600;color:var(--tx2);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .15s}
.tab.on{color:var(--pr);border-bottom-color:var(--pr)}
.tc{display:none;padding:16px;max-width:780px;margin:0 auto}
.tc.on{display:block}
.pb{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pb label{font-size:.82rem;font-weight:600;color:var(--tx2);white-space:nowrap}
.pb input{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:.9rem;background:var(--sf2)}
.pb input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.pb .nt{font-size:.72rem;color:var(--tx3)}
.sp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.sp.res{margin-top:20px;border:2px solid var(--pr);box-shadow:var(--sh)}
.sp .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.sp .st{font-size:.84rem;font-weight:600;color:var(--tx2)}
.sp .sv{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.sp .mx{font-size:.95rem;color:var(--tx3);font-weight:400}
.pbar{height:8px;background:var(--bd2);border-radius:4px;overflow:hidden;margin:8px 0}
.pfill{height:100%;border-radius:4px;transition:width .35s,background .35s}
.jl{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.78rem;font-weight:600}
.j-ok{background:var(--gn2);color:var(--gn)}
.j-mid{background:var(--yw2);color:var(--yw)}
.j-bad{background:var(--rd2);color:var(--rd)}
.j-lo{background:var(--gn2);color:var(--gn)}
.j-hi{background:var(--or2);color:var(--or)}
.sgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.sg{background:var(--sf2);border-radius:8px;padding:8px 10px;text-align:center}
.sg .gl{font-size:.72rem;color:var(--tx2);margin-bottom:2px}
.sg .gv{font-size:1rem;font-weight:700}
.ua{font-size:.78rem;color:var(--or);margin-top:6px}
.qc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;transition:border-color .2s}
.qc.done{border-left:3px solid var(--gn)}
.qh{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.qn{background:var(--pr);color:#fff;font-size:.73rem;font-weight:700;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ql{font-size:.88rem;font-weight:600;line-height:1.45}
.os{display:flex;flex-direction:column;gap:5px}
.ob{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;text-align:left;font-size:.82rem;line-height:1.45;transition:all .12s;-webkit-user-select:none;user-select:none}
.ob:active{transform:scale(.98)}
.ob.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.ob .bg{min-width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:.73rem;font-weight:700;background:rgba(0,0,0,.06);flex-shrink:0}
.ob.on .bg{background:rgba(255,255,255,.22)}
.nrs-row{display:flex;gap:4px;flex-wrap:wrap}
.nrs-btn{width:40px;height:40px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;font-size:.88rem;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .12s;-webkit-user-select:none;user-select:none}
.nrs-btn:active{transform:scale(.95)}
.nrs-btn.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.nrs-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);margin-top:2px;padding:0 2px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border:none;border-radius:var(--r);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none;font-family:var(--f)}
.btn:active{transform:scale(.97)}
.b1{background:var(--pr);color:#fff}.b1:hover{background:var(--pr3)}
.b2{background:var(--rd2);color:var(--rd)}.b2:hover{background:#fecaca}
.b3{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.b3:hover{background:var(--bd2)}
.qa{margin-top:24px;text-align:center}
.qw{display:inline-block;padding:20px;background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh)}
.qwrap{margin-bottom:14px}
.qnum{font-size:.8rem;color:var(--pr3);font-weight:700;margin-bottom:10px;letter-spacing:.02em}
.qmulti{background:var(--pr2);color:var(--pr3);padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:14px;text-align:left;border:1px solid #bfdbfe;line-height:1.6}
.qt{margin-top:14px;text-align:left;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;font-size:.8rem;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;line-height:1.6;color:var(--tx2)}
.qwn{background:var(--yw2);color:#92400e;padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:14px;text-align:left;border:1px solid #fde68a}
.tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.tst.on{opacity:1}
.scale-desc{font-size:.78rem;color:var(--tx2);margin-bottom:12px;padding:8px 12px;background:var(--sf2);border-radius:8px;line-height:1.6}
.binary-row{display:flex;gap:8px}
.binary-btn{flex:1;padding:10px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;font-size:.85rem;font-weight:600;text-align:center;transition:all .12s;-webkit-user-select:none;user-select:none}
.binary-btn:active{transform:scale(.97)}
.binary-btn.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.risk-badge{display:inline-block;padding:4px 14px;border-radius:12px;font-size:.82rem;font-weight:700;margin-top:4px}
.risk-low{background:var(--gn2);color:var(--gn)}
.risk-mid{background:var(--yw2);color:var(--yw)}
.risk-high{background:var(--rd2);color:var(--rd)}
.draft-banner{background:var(--yw2);border-bottom:1px solid #fde68a;padding:10px 16px}
.draft-banner .db-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem;color:#92400e;padding:6px 0}
.draft-banner .db-row+.db-row{border-top:1px solid #fde68a}
.draft-banner .db-msg{flex:1;min-width:200px}
.draft-banner .db-btns{display:flex;gap:8px;flex-wrap:wrap}
.draft-banner .btn{padding:7px 14px;font-size:.78rem}
@media(max-width:600px){
  html{font-size:14px}
  .tab{padding:9px 12px;font-size:.78rem}
  .tc{padding:12px}
  .sgs{grid-template-columns:repeat(2,1fr)}
  .nrs-btn{width:34px;height:34px;font-size:.82rem}
}
.hbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--rd);background:var(--rd2);border:none;border-radius:8px;cursor:pointer}
.hbtn:active{transform:translateY(-50%) scale(.96)}
</style>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;

              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));

        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

// ========== STATE ==========
var ANS={};
var NM='';

// ========== PERSISTENCE (下書き自動保存・2スロット) ==========
// 仕様：sessionStorage/Cookie/外部送信は使用しない。localStorageは下書き自動保存のみに限定。
// 既存の下書きがある場合は自動復元せず、確認バナーで検査者に選択させる。
var SLOT_KEYS={A:'painToolSave_slotA',B:'painToolSave_slotB'};
var mySlot=null;      // このタブが書き込むスロット（'A' or 'B'）。決定するまでnull。
var saveTimer=null;   // デバウンス用タイマー

function readSlot(slot){
  try{
    var raw=localStorage.getItem(SLOT_KEYS[slot]);
    if(!raw)return null;
    var d=JSON.parse(raw);
    if(!d||typeof d.a!=='object')return null;
    return d;
  }catch(e){return null}
}
function slotHasData(d){
  return !!d && (Object.keys(d.a||{}).length>0 || !!(d.n&&d.n!==''));
}
function writeSlot(slot,data){
  try{localStorage.setItem(SLOT_KEYS[slot],JSON.stringify(data))}catch(e){}
}
function clearSlot(slot){
  try{localStorage.removeItem(SLOT_KEYS[slot])}catch(e){}
}
function fmtTime(t){
  var d=new Date(t);
  function p(n){return (n<10?'0':'')+n}
  return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
// 実際の保存（デバウンス後に呼ばれる）
function saveStateImmediate(){
  if(!mySlot)return;
  writeSlot(mySlot,{a:ANS,n:NM,t:Date.now()});
}
// 入力変更のたびに呼び出す保存関数（300〜500msデバウンス）
function saveState(){
  if(!mySlot)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveStateImmediate,400);
}
// QRコード生成後に表示される「入力データを消去する」ボタンから呼ばれる。
// 仕様7-4：QRコード生成だけでは下書きを自動消去しない。検査者が明示的にこのボタンを押し、
// 確認ダイアログで同意した場合のみ、そのタブが使用しているスロットの下書きを消去する。
function requestClearDraft(scaleId){
  if(!confirm('この端末に一時保存されている入力データ（下書き）を消去しますか？\n※表示済みのQRコード・テキストはそのまま確認できます。'))return;
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);
  var btn=E('clr-'+scaleId);
  if(btn){btn.disabled=true;btn.textContent='消去しました';}
  toast('入力データを消去しました');
}

// ---- 起動時のスロット判定・確認バナー ----
function initPersistence(){
  refreshDraftBanner();
}
// 現在のスロット状況を読み取る
function computeDraftState(){
  var dA=readSlot('A'), dB=readSlot('B');
  return {dA:dA,dB:dB,hasA:slotHasData(dA),hasB:slotHasData(dB)};
}
// バナー表示・mySlot（暫定割り当て含む）を現在のスロット状況に合わせて更新する。
// 「この下書きを削除」で片方だけ消えた場合など、状態変化のたびに呼び直す。
function refreshDraftBanner(){
  var st=computeDraftState();
  if(!st.hasA&&!st.hasB){
    hideDraftBanner();
    if(!mySlot)mySlot='A';
    return;
  }
  if(st.hasA&&st.hasB){
    mySlot=null; // 両方に下書きあり：解決するまで保存を保留
    showDraftBanner(st.dA,st.dB);
    return;
  }
  // 片方のみ下書きあり：もう一方の空いているスロットを暫定的に割り当てる
  mySlot = st.hasA ? 'B' : 'A';
  showDraftBanner(st.hasA?st.dA:null, st.hasB?st.dB:null);
}
function bannerRow(slot,d){
  return '<div class="db-row"><span class="db-msg">保存されている入力があります（氏名：'+esc(d.n||'(未入力)')+'　最終更新：'+fmtTime(d.t)+'）</span><span class="db-btns"><button class="btn b1" onclick="resumeSlot(\''+slot+'\')">続きから再開</button><button class="btn b2" onclick="deleteSlotDraft(\''+slot+'\')">この下書きを削除</button></span></div>';
}
function showDraftBanner(dA,dB){
  var el=E('draftBanner');if(!el)return;
  var h='<div class="draft-banner">';
  if(dA&&dB){
    h+=bannerRow('A',dA);
    h+=bannerRow('B',dB);
    h+='<div class="db-row"><span class="db-msg">まとめて操作する場合：</span><span class="db-btns"><button class="btn b2" onclick="discardBoth()">両方とも破棄して新規入力</button></span></div>';
  }else{
    var slot=dA?'A':'B';
    var d=dA||dB;
    h+=bannerRow(slot,d);
    // 仕様7-3：空きスロットがある場合のみ。既存の下書きには一切触れずにバナーを閉じる
    h+='<div class="db-row"><span class="db-msg">この下書きを残したまま、別の患者の入力を始める場合：</span><span class="db-btns"><button class="btn b3" onclick="keepDrafts()">下書きは残して新規入力</button></span></div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
function keepDrafts(){hideDraftBanner()}
function hideDraftBanner(){var el=E('draftBanner');if(el)el.innerHTML=''}
function resumeSlot(slot){
  var d=readSlot(slot);
  mySlot=slot;
  ANS=(d&&d.a)?d.a:{};
  NM=(d&&d.n)?d.n:'';
  hideDraftBanner();
  restoreUI();
  updAll();
  toast('前回の入力を復元しました');
}
// スロットごとの個別削除：確認ダイアログの後、該当スロットのみを空にする。
// もう一方に下書きが残っていればバナー表示を継続し、両方空になれば新規入力画面に切り替える。
function deleteSlotDraft(slot){
  var d=readSlot(slot);
  var info=d?('（氏名：'+(d.n||'(未入力)')+'　最終更新：'+fmtTime(d.t)+'）'):'';
  if(!confirm('この下書き'+info+'を削除しますか？\nこの操作は取り消せません。'))return;
  clearSlot(slot);
  toast('下書きを削除しました');
  refreshDraftBanner();

// ========== SCORING ==========
function calcScore(sid){
  var sc=SCALES[sid];
  var total=0,answered=0,count=0;
  var sub={};

  if(sid==='startback'){
    count=9;
    var stotal=0,subtotal=0,sans=0,subans=0;
    for(var i=0;i<9;i++){
      var qid=sid+'_q'+i;
      if(ANS[qid]!==undefined){
        stotal+=ANS[qid];sans++;
        if(i>=4){subtotal+=ANS[qid];subans++}
      }
    }
    return{total:sans===9?stotal:null,partial:stotal,answered:sans,count:9,unanswered:9-sans,sub:{},subTotal:subans===5?subtotal:null,subPartial:subtotal};
  }

  if(sid==='hads'){
    count=14;
    var aScore=0,dScore=0,aAns=0,dAns=0;
    for(var i=0;i<sc.items.length;i++){
      var qid=sid+'_q'+i;
      if(ANS[qid]!==undefined){
        answered++;
        total+=ANS[qid];
        if(sc.items[i].sub==='A'){aScore+=ANS[qid];aAns++}
        else{dScore+=ANS[qid];dAns++}
      }
    }
    sub['不安']=aAns===7?aScore:null;
    sub['抑うつ']=dAns===7?dScore:null;
    return{total:answered===14?total:null,partial:total,answered:answered,count:14,unanswered:14-answered,sub:sub,subPartial:{'不安':aScore,'抑うつ':dScore}};
  }

  var itemCount=sc.items.length;
  count=itemCount;
  for(var i=0;i<itemCount;i++){
    var qid=sid+'_q'+i;
    if(ANS[qid]!==undefined){total+=ANS[qid];answered++}
  }
  if(sc.subscales){
    var sk=Object.keys(sc.subscales);
    for(var s=0;s<sk.length;s++){
      var ssn=sk[s],ss=sc.subscales[ssn];
      var st=0,sa=0;
      for(var j=0;j<ss.indices.length;j++){
        var qid2=sid+'_q'+ss.indices[j];
        if(ANS[qid2]!==undefined){st+=ANS[qid2];sa++}
      }
      sub[ssn]=sa===ss.indices.length?st:null;
    }
  }
  return{total:answered===count?total:null,partial:total,answered:answered,count:count,unanswered:count-answered,sub:sub};
}

// ========== QR ==========
// QRコード1枚あたりの目安文字数。これを超えるテキストは複数枚に分割する。
// 1枚に詰め込むとマス目が細かくなり、スマホのカメラで読み取りにくくなるため。
var QR_MAX_CHARS=120;

// テキストを行単位で複数のQRコード用に分割する。
// 1行目（◆尺度名 合計…）は各枚に付け直し、どの枚も単独で何の評価か分かるようにする。
function splitTextForQR(txt){
  if(txt.length<=QR_MAX_CHARS)return[txt];
  var lines=txt.split('\r\n');
  var head=lines[0];
  var rest=lines.slice(1);
  var parts=[],cur=[],curLen=0;
  var headRoom=head.length+8;               // ヘッダと「（1/3）」の分を差し引く
  for(var i=0;i<rest.length;i++){
    var L=rest[i];
    if(cur.length&&curLen+L.length+2+headRoom>QR_MAX_CHARS){parts.push(cur);cur=[];curLen=0}
    cur.push(L);curLen+=L.length+2;
  }
  if(cur.length)parts.push(cur);
  if(parts.length<=1)return[txt];
  var out=[];
  for(var p=0;p<parts.length;p++){
    out.push(head+'（'+(p+1)+'/'+parts.length+'）\r\n'+parts[p].join('\r\n'));
  }
  return out;
}

function genQR(scaleId){
  var sc=SCALES[scaleId];
  var r=calcScore(scaleId);
  var txt;
  if(r.answered===0){toast('回答がありません');return}
  if(scaleId==='startback'){
    var rr={total:r.total!==null?r.total:r.partial,subTotal:r.subTotal!==null?r.subTotal:r.subPartial};
    txt=sc.qrTpl(rr);
  }else if(scaleId==='hads'){
    var rr2={total:r.total!==null?r.total:r.partial,sub:{}};
    rr2.sub['不安']=r.sub['不安']!==null?r.sub['不安']:r.subPartial['不安'];
    rr2.sub['抑うつ']=r.sub['抑うつ']!==null?r.sub['抑うつ']:r.subPartial['抑うつ'];
    txt=sc.qrTpl.call(sc,rr2);
  }else{
    var rr3={total:r.total!==null?r.total:r.partial,sub:{}};
    if(sc.subscales){
      var sk=Object.keys(sc.subscales);
      for(var s=0;s<sk.length;s++){
        var ssn=sk[s];
        rr3.sub[ssn]=r.sub[ssn]!==null?r.sub[ssn]:'—';
      }
    }
    txt=sc.qrTpl(rr3);
  }
  var parts=splitTextForQR(txt);
  var area=E('qr-'+scaleId);
  var h='';
  if(r.unanswered>0)h+='<div class="qwn">⚠ 未回答の項目が'+r.unanswered+'件あります。</div>';
  if(parts.length>1)h+='<div class="qmulti">項目数が多いため、QRコードを<b>'+parts.length+'枚</b>に分けています。<b>1枚目から順に</b>読み取ってください。</div>';
  for(var p=0;p<parts.length;p++){
    h+='<div class="qwrap"><div class="qw">';
    if(parts.length>1)h+='<div class="qnum">'+(p+1)+' / '+parts.length+' 枚目</div>';
    h+='<canvas id="cv-'+scaleId+'-'+p+'"></canvas></div></div>';
  }
  h+='<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">';
  h+='<button class="btn b3" onclick="cpTxt(\''+scaleId+'\')">テキストをコピー</button>';
  h+='<button class="btn b2" id="clr-'+scaleId+'" onclick="requestClearDraft(\''+scaleId+'\')">入力データを消去する</button>';
  h+='</div>';
  h+='<div class="qt" id="qt-'+scaleId+'">'+esc(txt)+'</div>';
  area.innerHTML=h;
  try{
    for(var p2=0;p2<parts.length;p2++){
      var qr=qrcode(0,'M');qr.addData(parts[p2]);qr.make();
      var mc=qr.getModuleCount(),cs=Math.max(4,Math.min(8,Math.floor(280/mc))),mg=cs*4,sz=mc*cs+mg*2;
      var cv=E('cv-'+scaleId+'-'+p2);cv.width=sz;cv.height=sz;
      var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#000';
      for(var r2=0;r2<mc;r2++)for(var c=0;c<mc;c++){if(qr.isDark(r2,c))ctx.fillRect(mg+c*cs,mg+r2*cs,cs,cs)}
    }
  }catch(e){area.innerHTML+='<div style="color:var(--rd);margin-top:8px;font-size:.82rem">QRコード生成エラー: '+esc(e.message||String(e))+'</div>'}
}

function cpTxt(scaleId){
  var el=E('qt-'+scaleId);
  if(!el){
    var sc=SCALES[scaleId];
    var r=calcScore(scaleId);
    if(r.answered===0){toast('回答がありません');return}
    var txt;
    if(scaleId==='startback'){
      var rr={total:r.total!==null?r.total:r.partial,subTotal:r.subTotal!==null?r.subTotal:r.subPartial};
      txt=sc.qrTpl(rr);
    }else if(scaleId==='hads'){
      var rr2={total:r.total!==null?r.total:r.partial,sub:{}};
      rr2.sub['不安']=r.sub['不安']!==null?r.sub['不安']:r.subPartial['不安'];
      rr2.sub['抑うつ']=r.sub['抑うつ']!==null?r.sub['抑うつ']:r.subPartial['抑うつ'];
      txt=sc.qrTpl.call(sc,rr2);
    }else{
      var rr3={total:r.total!==null?r.total:r.partial,sub:{}};
      if(sc.subscales){
        var sk=Object.keys(sc.subscales);
        for(var s=0;s<sk.length;s++){
          var ssn=sk[s];
          rr3.sub[ssn]=r.sub[ssn]!==null?r.sub[ssn]:'—';
        }
      }
      txt=sc.qrTpl(rr3);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('コピーしました')},function(){fbCp(txt)})}else fbCp(txt);
    return;
  }
  var txt2=el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt2).then(function(){toast('コピーしました')},function(){fbCp(txt2)})}else fbCp(txt2);
}
function fbCp(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('コピーに失敗しました')}document.body.removeChild(ta)}

function doReset(scaleId){
  var sc=SCALES[scaleId];
  if(!confirm(sc.name+'の全回答・QRをリセットしますか？'))return;
  var count=sc.type==='binary'?9:sc.items.length;
  for(var i=0;i<count;i++){delete ANS[scaleId+'_q'+i]}
  var tab=E('t-'+scaleId);
  if(tab){
    var obs=tab.querySelectorAll('.ob,.nrs-btn,.binary-btn');
    for(var i=0;i<obs.length;i++)obs[i].className=obs[i].className.replace(/ ?on/g,'');
    var cards=tab.querySelectorAll('.qc');
    for(var i=0;i<cards.length;i++)cards[i].className='qc';
  }
  var qra=E('qr-'+scaleId);if(qra)qra.innerHTML='';
  updAll();
  saveState();
}

/* ヘッダーの高さを測ってタブ帯の固定位置（--hdH）に反映する。
   画面の幅や文字サイズでヘッダーの高さが変わっても、タブ帯が隠れないようにするため */
function syncHeaderHeight(){
  var hd=document.querySelector('.hd');
  if(!hd)return;
  document.documentElement.style.setProperty('--hdH',hd.offsetHeight+'px');
}
window.addEventListener('resize',syncHeaderHeight);
window.addEventListener('orientationchange',syncHeaderHeight);

// ========== INIT ==========
function init(){
  buildAll();
  syncName();
  initPersistence();
  updAll();
  syncHeaderHeight();
  var hd=document.querySelector('.hd');
  if(hd&&window.ResizeObserver){ try{ new ResizeObserver(syncHeaderHeight).observe(hd); }catch(e){} }
}
window.onload=init;
</script>
<script>
/* オフライン動作（Service Worker）の登録。
   登録に失敗しても catch で握りつぶすため、ツール本体の動作には影響しません。 */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>新日本版トークンテスト</title>
<!-- ▼ ウェブ公開・オフライン対応のための追記（採点ロジックには影響しません） -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トークンテスト">
<!-- ▲ 追記ここまで -->
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --border:#d8dee4;
  --text:#222; --muted:#6b7280;
  --accent:#2563eb; --accent-light:#dbeafe;
  --warn:#d97706; --danger:#dc2626; --ok:#059669;
  --section:#eff3f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  line-height:1.5;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0 0 10px;padding:10px 12px;background:var(--accent);color:#fff;border-radius:6px}
h2{font-size:16px;margin:18px 0 8px;padding:8px 10px;background:#1f2937;color:#fff;border-radius:4px}
h3{font-size:15px;margin:14px 0 6px;padding:6px 10px;background:var(--section);border-left:4px solid var(--accent);border-radius:2px}

.patient-bar{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.patient-bar label{font-weight:bold;white-space:nowrap;font-size:13px}
.patient-bar input,.patient-bar select{flex:1;min-width:100px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:14px}
.patient-bar input[type=number]{max-width:72px;flex:none}
.patient-bar input[type=date]{max-width:160px;flex:none}

/* タブ帯は画面の上に固定する（下までスクロールしてもタブを押せるようにするため）。
   タブは折り返さず横1列にして、入りきらない場合は横スクロールで送る */
.tabs{display:flex;flex-wrap:nowrap;gap:4px;border-bottom:2px solid var(--accent);margin-bottom:10px;
  position:sticky;top:0;z-index:50;background:var(--bg);padding-top:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;white-space:nowrap;padding:8px 14px;border:1px solid var(--border);border-bottom:none;
  background:#e5e7eb;cursor:pointer;border-radius:6px 6px 0 0;font-size:13px;font-weight:bold}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-panel{display:none;background:var(--panel);border:1px solid var(--border);
  border-top:none;border-radius:0 0 6px 6px;padding:12px}
.tab-panel.active{display:block}

.unit-header{background:var(--accent);color:#fff;padding:8px 12px;border-radius:4px;
  margin:0 0 10px;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.unit-score-badge{font-size:14px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:10px}

.instr-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:4px;padding:8px 12px;
  font-size:13px;color:#1e40af;margin-bottom:10px;line-height:1.7}

/* 問カード */
.q-card{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;background:#fafbfc}
.q-num{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:bold}

/* 文節チップ（下線 + ○✕ボタン） */
.phrase-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0}
.phrase-chip{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.phrase-word{
  font-size:15px;font-weight:bold;
  border-bottom:2px solid var(--text);
  padding:0 3px 2px;
  white-space:nowrap;
}
.phrase-btns{display:flex;gap:4px}
.pb{padding:4px 10px;border:1px solid var(--border);border-radius:4px;
  background:#fff;cursor:pointer;font-size:13px;font-weight:bold;
  user-select:none;transition:all .12s;min-width:38px;text-align:center}
.pb:hover{border-color:var(--accent);background:var(--accent-light)}
.pb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pb.ng{background:var(--danger);color:#fff;border-color:var(--danger)}

/* [A] 用シンプル正誤ボタン */
.simple-btns{display:flex;gap:8px;margin-top:6px}
.sbtn{padding:7px 18px;border:1px solid var(--border);border-radius:4px;
  background:#fff;cursor:pointer;font-size:14px;font-weight:bold;
  user-select:none;transition:all .12s}
.sbtn:hover{border-color:var(--accent);background:var(--accent-light)}
.sbtn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sbtn.ng{background:var(--danger);color:#fff;border-color:var(--danger)}

.stop-warn{background:#fef3c7;border:1px solid var(--warn);border-radius:4px;
  padding:8px 12px;color:#92400e;font-size:13px;margin:6px 0;font-weight:bold}

/* サマリー */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:10px;text-align:center}
.summary-card .sname{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:bold}
.summary-card .sval{font-size:24px;font-weight:bold;color:var(--accent)}
.summary-card .smax{font-size:12px;color:var(--muted)}
.summary-total{background:var(--accent);color:#fff;border-radius:6px;padding:12px;
  text-align:center;margin:10px 0;font-size:18px;font-weight:bold}

/* ボタン・QR */
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{padding:8px 14px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-reset{background:#e5e7eb;color:#111}
.btn-copy{background:var(--ok);color:#fff}
.qr-area{margin-top:14px;padding:12px;background:#f9fafb;border:1px solid var(--border);border-radius:6px}
.qr-canvas{background:#fff;display:inline-block;padding:8px;border:1px solid var(--border)}
.qr-text{margin-top:10px;padding:8px;background:#fff;border:1px solid var(--border);
  border-radius:4px;white-space:pre-wrap;font-family:monospace;font-size:12px;max-height:300px;overflow:auto}

.sub-total{text-align:right;font-weight:bold;padding:6px 4px;color:var(--accent);font-size:14px}
.note-area{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px;
  font-size:13px;resize:vertical;font-family:inherit}
.footer-note{font-size:11px;color:var(--muted);margin-top:20px;text-align:center;padding-bottom:20px}

/* 下書き自動保存の確認バナー（ベース仕様書 7-3） */
.draft-banner{background:#fff7ed;border:1px solid var(--warn);border-radius:6px;padding:10px;margin-bottom:10px}
.db-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.db-row:last-child{margin-bottom:0}
.db-msg{font-size:13px;color:#92400e;flex:1;min-width:180px}
.patient-note{font-size:12px;color:var(--muted);width:100%}
</style>
</head>
<body>

/* ============================================================
   STATE
   ============================================================ */
const STATE = {
  patientName:'', age:'', gender:'', examDate:'', examiner:'', note:'',
  A: new Array(7).fill(null),          // null=未, 1=正, 0=誤
  B: QB.map(q => new Array(q.phrases.length).fill(null)),
  C: QC.map(q => new Array(q.phrases.length).fill(null)),
  D: QD.map(q => new Array(q.phrases.length).fill(null)),
  E: QE.map(q => new Array(q.phrases.length).fill(null)),
  F: QF.map(q => new Array(q.phrases.length).fill(null)),
};

/* ============================================================
   スコア計算
   ============================================================ */
function rowScore(arr){ return arr.reduce((s,v)=>s+(v===null?0:v),0); }
function unitScore(arr2d){ return arr2d.reduce((s,row)=>s+rowScore(row),0); }
function scoreA(){ return STATE.A.reduce((s,v)=>s+(v===null?0:v),0); }
function scoreB(){ return unitScore(STATE.B); }
function scoreC(){ return unitScore(STATE.C); }
function scoreD(){ return unitScore(STATE.D); }
function scoreE(){ return unitScore(STATE.E); }
function scoreF(){ return unitScore(STATE.F); }
function maxB(){ return QB.reduce((s,q)=>s+q.phrases.length,0); }  // 8
function maxF(){ return QF.reduce((s,q)=>s+q.phrases.length,0); }  // 99
function scoreABCDE(){ return scoreA()+scoreB()+scoreC()+scoreD()+scoreE(); }
function scoreTotal(){ return scoreABCDE()+scoreF(); }
/* 未回答（○も✕も押していない）文節の数。中止した以降の項目もここに含まれる */
function unansweredCount(){
  let n=STATE.A.filter(v=>v===null).length;
  ['B','C','D','E','F'].forEach(k=>{
    STATE[k].forEach(row=>{ n+=row.filter(v=>v===null).length; });
  });
  return n;
}

/* ============================================================
   DOM ヘルパー
   ============================================================ */
function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(txt!=null) e.textContent=txt;
  return e;
}

// [A] 用 シンプル正誤ボタン（1点固定）
function makeABtn(label, value, current, onPick){
  const cls='sbtn'+(current===value?(value===1?' ok':' ng'):'');
  const b=el('div',cls,label);
  b.onclick=()=>{ onPick(current===value?null:value); render(); };
  return b;
}

// [B][C][D][E][F] 文節チップ
function makePhraseChip(word, current, onPick){
  const chip=el('div','phrase-chip');
  chip.appendChild(el('span','phrase-word',word));
  const btns=el('div','phrase-btns');
  const ok=el('div','pb'+(current===1?' ok':''),'○');
  ok.onclick=()=>{ onPick(current===1?null:1); render(); };
  const ng=el('div','pb'+(current===0?' ng':''),'✕');
  ng.onclick=()=>{ onPick(current===0?null:0); render(); };
  btns.appendChild(ok); btns.appendChild(ng);
  chip.appendChild(btns);
  return chip;
}

// 文節カードを描画する共通関数
function renderPhraseUnit(panel, qs, stateArr){
  qs.forEach((q,qi)=>{
    const qs2=rowScore(stateArr[qi]);
    const card=el('div','q-card');
    card.appendChild(el('div','q-num','問'+q.num+'　得点：'+qs2+' / '+q.phrases.length+'点'));
    const row=el('div','phrase-row');
    q.phrases.forEach((ph,pi)=>{
      row.appendChild(makePhraseChip(ph, stateArr[qi][pi], v=>{ stateArr[qi][pi]=v; }));
    });
    card.appendChild(row);
    panel.appendChild(card);
  });
}

/* ============================================================
   タブ定義
   ============================================================ */
const TABS=[
  {id:'unitA', title:'[A]',    render:renderA},
  {id:'unitB', title:'[B]',    render:renderB},
  {id:'unitC', title:'[C]',    render:renderC},
  {id:'unitD', title:'[D]',    render:renderD},
  {id:'unitE', title:'[E]',    render:renderE},
  {id:'unitF', title:'[F]',    render:renderF},
  {id:'result',title:'結果・QR',render:renderResult},
];
let activeTab='unitA';

/* 横スクロールするタブ帯で、選んでいるタブが画面の外に隠れないよう横方向に寄せる。
   block:'nearest' を指定して、ページの縦位置は動かさない */
function scrollActiveTabIntoView(bar){
  const act=bar.querySelector('.tab-btn.active');
  if(!act||!act.scrollIntoView)return;
  try{ act.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
}

/* ============================================================
   render（共通フレーム）
   ============================================================ */
function render(){
  // タブ
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML='';
  TABS.forEach(t=>{
    const b=el('div','tab-btn'+(activeTab===t.id?' active':''),t.title);
    b.onclick=()=>{ activeTab=t.id; render(); window.scrollTo(0,0); };
    tabsEl.appendChild(b);
  });
  scrollActiveTabIntoView(tabsEl);

  const panels=document.getElementById('panels');
  panels.innerHTML='';
  const panel=el('div','tab-panel active');

  // 患者情報バー
  const pb=el('div','patient-bar');
  function addInp(lbl,type,key,extra){
    pb.appendChild(el('label',null,lbl));
    let inp;
    if(type==='select'){
      inp=document.createElement('select');
      [['','—'],['男','男'],['女','女']].forEach(([v,t])=>{
        const o=document.createElement('option'); o.value=v; o.textContent=t;
        if(STATE[key]===v) o.selected=true;
        inp.appendChild(o);
      });
      inp.onchange=e=>{STATE[key]=e.target.value;};
    } else {
      inp=document.createElement('input'); inp.type=type;
      inp.value=STATE[key]||'';
      inp.oninput=e=>{STATE[key]=e.target.value;};
    }
    if(extra) Object.assign(inp.style, extra);
    pb.appendChild(inp);
  }
  addInp('氏名：','text','patientName');
  addInp('年齢：','number','age',{maxWidth:'70px',flex:'none'});
  pb.appendChild(el('span',null,'歳'));
  addInp('性別：','select','gender');
  addInp('検査日：','date','examDate',{maxWidth:'160px',flex:'none'});
  addInp('検査者：','text','examiner');
  pb.appendChild(el('div','patient-note','※ 氏名はQRコードには含まれません。画面表示のみに使用します。この端末に下書きとして一時保存されるため、カルテ転記が完了したらQR生成後に表示される消去ボタン、または全リセットで消去してください。'));
  panel.appendChild(pb);

  TABS.find(t=>t.id===activeTab).render(panel);

  if(activeTab!=='result'){
    const br=el('div','btn-row');
    const ra=el('button','btn btn-reset','全リセット');
    ra.onclick=()=>{if(confirm('すべての回答をリセットしますか？')){resetAll();render();}};
    br.appendChild(ra);
    panel.appendChild(br);
  }
  panels.appendChild(panel);
}

/* ============================================================
   QRテキスト生成
   形式：各ユニットの合計点のみ（問別詳細行なし）
   ============================================================ */

/* 項目数の割にQRへ入れる行数は少ないため、QRは1枚にまとめる（ベース仕様書 6-2）。
   明細は1行1項目（6-2-1） */
function buildQRText(){
  const L=[];
  L.push('◆新日本版トークンテスト');
  L.push('[A] '+scoreA()+'/7');
  L.push('[B] '+scoreB()+'/'+maxB());
  L.push('[C] '+scoreC()+'/12');
  L.push('[D] '+scoreD()+'/16');
  L.push('[E] '+scoreE()+'/24');
  L.push('[A～E] '+scoreABCDE()+'/67');
  L.push('[F] '+scoreF()+'/'+maxF());
  L.push('合計 '+scoreTotal()+'/166');
  const un=unansweredCount();
  if(un>0) L.push('※未回答 '+un+'件（0点として計算していません）');
  if(STATE.note) L.push('備考: '+STATE.note);
  return L.join('\n');
}

/* 読み取り先で改行が保たれるよう、改行コードは CRLF に揃える */
function toCRLF(raw){ return raw.replace(/\r\n/g,'\n').replace(/\n/g,'\r\n'); }

function generateQR(){
  const text=toCRLF(buildQRText());
  document.getElementById('qr-text-1').textContent=text;
  const canvas=document.getElementById('qr-canvas-1');
  canvas.innerHTML='';
  try{
    const qr=qrcode(0,'M'); qr.addData(text); qr.make();
    canvas.innerHTML=qr.createSvgTag(4,6);
  }catch(e){
    canvas.innerHTML='<div style="color:red;padding:8px">QR生成エラー: '+e.message+'</div>';
  }
  const cb=document.getElementById('qr-copy-1');
  cb.onclick=()=>{
    navigator.clipboard.writeText(text).then(()=>{
      cb.textContent='コピーしました ✓';
      setTimeout(()=>{cb.textContent='テキストをコピー';},2000);
    },()=>{
      const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');cb.textContent='コピーしました ✓';}catch(e){}
      document.body.removeChild(ta);setTimeout(()=>{cb.textContent='テキストをコピー';},2000);
    });
  };
  const a=document.getElementById('qr-area');
  a.style.display='block';
  // 下書き消去ボタンを表示する（QR生成だけでは自動消去しない：ベース仕様書 7-4）
  const clearRow=document.getElementById('draft-clear-row');
  if(clearRow)clearRow.style.display='';
  try{a.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}
}

/* ============================================================
   リセット
   ============================================================ */
function resetAll(){
  STATE.patientName=''; STATE.age=''; STATE.gender='';
  STATE.examDate=''; STATE.examiner=''; STATE.note='';
  STATE.A=new Array(7).fill(null);
  STATE.B=QB.map(q=>new Array(q.phrases.length).fill(null));
  STATE.C=QC.map(q=>new Array(q.phrases.length).fill(null));
  STATE.D=QD.map(q=>new Array(q.phrases.length).fill(null));
  STATE.E=QE.map(q=>new Array(q.phrases.length).fill(null));
  STATE.F=QF.map(q=>new Array(q.phrases.length).fill(null));
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);   // 全リセットでは下書きも消す（ベース仕様書 8章）
}

/* ============================================================
   下書き自動保存・復元（ベース仕様書 7章）
   - localStorage に独立した2スロット（A/B）を持つ。1タブ＝1スロット
   - sessionStorage・Cookie・外部送信は使用しない
   - 既存の下書きは自動復元せず、確認バナーで検査者に選ばせる
   - 消去は「QR生成後の消去ボタン」または「全リセット」のときだけ
   ============================================================ */
var SLOT_KEYS={A:'tokenSave_slotA',B:'tokenSave_slotB'};
var mySlot=null;          // このタブが書き込むスロット。決まるまでnull
var saveTimer=null;
var EMPTY_SNAPSHOT=JSON.stringify(STATE);   // 未入力状態の控え（空のまま保存しないため）

function readSlot(s){
  try{
    var raw=localStorage.getItem(SLOT_KEYS[s]);
    if(!raw)return null;
    var d=JSON.parse(raw);
    return (d&&d.s)?d:null;
  }catch(e){ return null; }
}
function writeSlot(s,d){ try{ localStorage.setItem(SLOT_KEYS[s],JSON.stringify(d)); }catch(e){} }
function clearSlot(s){ try{ localStorage.removeItem(SLOT_KEYS[s]); }catch(e){} }
function hasAnyInput(){ return JSON.stringify(STATE)!==EMPTY_SNAPSHOT; }

/* 入力のたびに呼ばれる。連続入力で書き込みが増えないよう400ms待ってからまとめて保存する */
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,400); }
function saveDraft(){
  if(!mySlot)return;                                  // スロット未確定（両方に下書きあり）の間は保存しない
  if(!hasAnyInput()){ clearSlot(mySlot); return; }     // 全部空なら下書きも残さない
  writeSlot(mySlot,{v:1,n:STATE.patientName,t:Date.now(),s:STATE});
}

/* 保存内容をSTATEへ書き戻す。STATE側にあるキーだけを上書きするので、
   古い版の下書きを読んでも新しい項目が消えない */
function mergeInto(dst,src){
  if(!src||typeof src!=='object')return;
  var keys=Object.keys(dst).length?Object.keys(dst):Object.keys(src);
  keys.forEach(function(k){
    var sv=src[k];
    if(sv===undefined)return;
    if(dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k])&&sv&&typeof sv==='object'&&!Array.isArray(sv)){
      mergeInto(dst[k],sv);
    }else{
      dst[k]=sv;
    }
  });
}

function fmtDraftTime(ts){
  var d=new Date(ts);
  function p(n){ return n<10?'0'+n:''+n; }
  return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function refreshDraftBanner(){
  var dA=readSlot('A'), dB=readSlot('B');
  if(!dA&&!dB){ hideDraftBanner(); if(!mySlot)mySlot='A'; return; }
  if(dA&&dB){ mySlot=null; showDraftBanner(dA,dB); return; }   // 空きなし：選ぶまで保存を保留
  mySlot=dA?'B':'A';                                           // 空いている方を暫定的に使う
  showDraftBanner(dA,dB);
}
function draftRow(slot,d){
  var row=el('div','db-row');
  row.appendChild(el('span','db-msg','保存されている入力があります（氏名：'+(d.n||'（未入力）')+'　最終更新：'+fmtDraftTime(d.t)+'）'));
  var go=el('button','btn btn-primary','続きから再開');
  go.onclick=function(){ resumeSlot(slot); };
  row.appendChild(go);
  var del=el('button','btn btn-reset','この下書きを削除');
  del.onclick=function(){
    if(!confirm('保存されている下書き（氏名：'+(d.n||'（未入力）')+'）を削除します。よろしいですか？'))return;
    clearSlot(slot); mySlot=null; refreshDraftBanner();
  };
  row.appendChild(del);
  return row;
}
function showDraftBanner(dA,dB){
  var box=document.getElementById('draftBanner');
  if(!box)return;
  box.innerHTML='';
  var wrap=el('div','draft-banner');
  wrap.appendChild(el('div','db-msg','自動では復元しません。続きから再開するか、削除するかを選んでください。'));
  if(dA)wrap.appendChild(draftRow('A',dA));
  if(dB)wrap.appendChild(draftRow('B',dB));
  var foot=el('div','db-row');
  if(mySlot){
    // 空きスロットがある場合のみ（仕様書 7-3）。既存の下書きには触れずにバナーを閉じる
    foot.appendChild(el('span','db-msg','この下書きを残したまま、別の患者の入力を始める場合：'));
    var keep=el('button','btn btn-reset','下書きは残して新規入力');
    keep.onclick=function(){ hideDraftBanner(); };
    foot.appendChild(keep);
  }
  if(dA&&dB){
    var both=el('button','btn btn-reset','両方とも破棄して新規入力');
    both.onclick=function(){
      if(!confirm('両方の下書きを破棄して新規入力にします。よろしいですか？'))return;
      clearSlot('A'); clearSlot('B'); mySlot=null; refreshDraftBanner();
    };
    foot.appendChild(both);
  }
  if(foot.childNodes.length)wrap.appendChild(foot);
  box.appendChild(wrap);
}
function hideDraftBanner(){
  var box=document.getElementById('draftBanner');
  if(box)box.innerHTML='';
}
function resumeSlot(slot){
  var d=readSlot(slot);
  if(!d)return;
  mergeInto(STATE,d.s);
  mySlot=slot;
  hideDraftBanner();
  activeTab='unitA';
  render();
}
function requestClearDraft(btn){
  if(!confirm('この端末に一時保存されている入力データ（下書き）を消去しますか？\n※表示中のQRコード・テキストはそのまま確認できます。'))return;
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);
  if(btn){ btn.disabled=true; btn.textContent='消去しました'; }
}

/* ============================================================
   初期化
   ============================================================ */
render();
refreshDraftBanner();
// 文字・数値の入力を拾う（選択ボタンは render() 経由で拾う）
document.addEventListener('input',scheduleSave,false);
// 性別のプルダウンは input イベントが出ない環境があるため change でも拾う
document.addEventListener('change',scheduleSave,false);
// 選択肢を押すたびに render() が呼ばれるので、そこに保存処理を足す
render=(function(orig){ return function(){ orig.apply(null,arguments); scheduleSave(); }; })(render);
</script>
<script>
/* オフライン動作（Service Worker）の登録。
   登録に失敗しても catch で握りつぶすため、ツール本体の動作には影響しません。 */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

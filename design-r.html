<head>

<title>DESIGN-R®2020 褥瘡状態評価</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;--sf:#fff;--sf2:#fafaf7;
  --tx:#1a1a1a;--tx2:#555;--tx3:#999;
  --bd:#e0ddd5;--bd2:#eeece6;
  --pr:#2563eb;--pr2:#dbeafe;--pr3:#1d4ed8;
  --gn:#16a34a;--gn2:#dcfce7;
  --yw:#ca8a04;--yw2:#fef9c3;
  --rd:#dc2626;--rd2:#fee2e2;
  --or:#ea580c;--or2:#ffedd5;
  --r:10px;--sh:0 1px 4px rgba(0,0,0,.07);
  --f:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo','Noto Sans JP',sans-serif;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--tx);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;font-family:var(--f)}
input,select,textarea{font-family:var(--f)}
.hd{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hd h1{font-size:1.05rem;font-weight:700;text-align:center;letter-spacing:.02em}
.hd .sub{font-size:.75rem;color:var(--tx2);text-align:center;margin-top:2px}
.wrap{padding:16px;max-width:780px;margin:0 auto}
.pb{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pb label{font-size:.82rem;font-weight:600;color:var(--tx2);white-space:nowrap}
.pb input{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:.9rem;background:var(--sf2)}
.pb input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.pb .nt{font-size:.72rem;color:var(--tx3)}
.sp{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.sp .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.sp .st{font-size:.84rem;font-weight:600;color:var(--tx2)}
.sp .sv{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.sp .mx{font-size:.95rem;color:var(--tx3);font-weight:400}
.pbar{height:8px;background:var(--bd2);border-radius:4px;overflow:hidden;margin:8px 0}
.pfill{height:100%;border-radius:4px;transition:width .35s,background .35s}
.jl{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.78rem;font-weight:600}
.j-gn{background:var(--gn2);color:var(--gn)}
.j-yw{background:var(--yw2);color:var(--yw)}
.j-or{background:var(--or2);color:var(--or)}
.j-rd{background:var(--rd2);color:var(--rd)}
.wsumm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wsumm-item{background:var(--sf2);border-radius:8px;padding:6px 12px;font-size:.8rem}
.wsumm-item .wlbl{color:var(--tx2);font-weight:600}
.wsumm-item .wval{font-weight:700;margin-left:4px}
.wcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:0;margin-bottom:16px;overflow:hidden}
.wcard-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf2);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.wcard-hd .wnum{font-size:.9rem;font-weight:700;white-space:nowrap}
.wcard-hd select{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font-size:.84rem;background:var(--sf);flex:1;min-width:120px}
.wcard-hd select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.wcard-del{margin-left:auto;padding:4px 10px;border:1px solid var(--rd2);border-radius:6px;background:var(--rd2);color:var(--rd);font-size:.78rem;font-weight:600;cursor:pointer}
.wcard-del:active{transform:scale(.97)}
.wcard-body{padding:14px 16px}
.wcard-foot{padding:10px 16px;border-top:1px solid var(--bd);background:var(--sf2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wcard-foot .notation{font-size:.88rem;font-weight:700;font-family:'SF Mono','Menlo','Consolas',monospace;letter-spacing:.02em}
.wcard-foot .wscore{font-size:.88rem;font-weight:700;color:var(--pr)}
.qsec{margin-bottom:14px}
.qsec-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.qsec-hd .qid{font-size:.82rem;font-weight:700;color:var(--pr);min-width:22px}
.qsec-hd .qtitle{font-size:.86rem;font-weight:700}
.qsec-hd .qsc{font-size:.76rem;color:var(--tx3);margin-left:auto;white-space:nowrap}
.qinst{font-size:.76rem;color:var(--tx2);margin:0 0 8px 0;line-height:1.55}
.qopts{display:flex;flex-direction:column;gap:4px}
.qopt{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;text-align:left;font-size:.82rem;line-height:1.4;transition:all .12s;-webkit-user-select:none;user-select:none}
.qopt:active{transform:scale(.98)}
.qopt.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.qopt .badge{min-width:36px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:.72rem;font-weight:700;background:rgba(0,0,0,.06);flex-shrink:0}
.qopt.on .badge{background:rgba(255,255,255,.22)}
.size-calc{background:var(--sf2);border:1px solid var(--bd2);border-radius:8px;padding:12px;margin-top:6px}
.size-tabs{display:flex;gap:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:10px}
.size-tab{flex:1;padding:7px 12px;font-size:.82rem;font-weight:600;text-align:center;border:none;background:var(--sf);color:var(--tx2);cursor:pointer;transition:all .12s}
.size-tab.on{background:var(--pr);color:#fff}
.size-input-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.size-input-row label{font-size:.8rem;color:var(--tx2);font-weight:600;min-width:40px}
.size-input-row input{width:80px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;font-size:.88rem;text-align:center;background:var(--sf)}
.size-input-row input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.size-result{margin-top:8px;font-size:.84rem;font-weight:600;color:var(--pr)}
.size-note{font-size:.74rem;color:var(--tx3);margin-top:4px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:11px 22px;border:none;border-radius:var(--r);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none;font-family:var(--f)}
.btn:active{transform:scale(.97)}
.b1{background:var(--pr);color:#fff}.b1:hover{background:var(--pr3)}
.b2{background:var(--rd2);color:var(--rd)}.b2:hover{background:#fecaca}
.b3{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.b3:hover{background:var(--bd2)}
.b-add{background:var(--gn2);color:var(--gn);border:1px dashed var(--gn);width:100%;padding:12px;font-size:.88rem;font-weight:600;border-radius:var(--r);cursor:pointer;text-align:center;margin-bottom:16px}
.b-add:hover{background:#bbf7d0}
.b-add:disabled{opacity:.4;cursor:not-allowed}
.qa{margin-top:24px;text-align:center}
.qw{display:inline-block;padding:20px;background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh)}
.qt{margin-top:14px;text-align:left;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;font-size:.8rem;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;line-height:1.6;color:var(--tx2)}
.qwn{background:var(--yw2);color:#92400e;padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:14px;text-align:left;border:1px solid #fde68a}
.tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 24px;border-radius:24px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.tst.on{opacity:1}
.rm{margin:10px 0}
.rm label{font-size:.82rem;font-weight:600;color:var(--tx2);display:block;margin-bottom:4px}
.rm textarea{width:100%;min-height:60px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font-size:.85rem;resize:vertical;background:var(--sf2)}
.rm textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
/* Patient tabs */
.ptabs{display:flex;background:var(--sf);border-bottom:2px solid var(--bd);padding:0 8px;position:sticky;top:49px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:stretch}
.ptabs::-webkit-scrollbar{display:none}
.ptab{position:relative;padding:10px 32px 10px 16px;font-size:.84rem;font-weight:600;color:var(--tx2);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .15s;flex-shrink:0}
.ptab.on{color:var(--pr);border-bottom-color:var(--pr)}
.ptab .ptab-nm{max-width:100px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.ptab-close{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;border:none;background:transparent;color:var(--tx3);font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .12s}
.ptab-close:hover{background:var(--rd2);color:var(--rd)}
.ptab-add{padding:10px 16px;font-size:.9rem;font-weight:700;color:var(--gn);border:none;background:none;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .12s}
.ptab-add:hover{color:#15803d}
.ptab-add:active{transform:scale(.95)}
@media(max-width:600px){
  html{font-size:14px}
  .wrap{padding:12px}
  .size-input-row{gap:6px}
  .ptab{padding:8px 28px 8px 12px;font-size:.8rem}
}

<header class="hd">
  <h1>DESIGN-R&#174;2020</h1>
  <div class="sub">褥瘡状態評価スケール・自動計算・QRコード生成</div>
</header>
<nav class="ptabs" id="ptabBar"></nav>
<div class="wrap">
  <div class="pb">
    <label>氏名</label>
    <input type="text" id="patientName" placeholder="患者氏名を入力" value="">
    <span class="nt">※ QRコードには含まれません</span>
  </div>
  <div class="sp" id="totalPanel">
    <div class="sh">
      <span class="st">総合スコア（参考）</span>
      <span class="sv" id="totalScore">—<span class="mx"> / 66点</span></span>
    </div>
    <div class="pbar"><div class="pfill" id="totalBar" style="width:0;background:var(--bd)"></div></div>
    <div id="totalJudge"></div>
    <div class="wsumm" id="woundSummary"></div>
  </div>
  <div id="woundContainer"></div>
  <button class="b-add" id="addWoundBtn" onclick="addWound()">＋ 創を追加</button>
  <div class="rm">
    <label>備考</label>
    <textarea id="remarks" placeholder="自由記載欄"></textarea>
  </div>
  <div class="acts">
    <button class="btn b1" onclick="genQR()">QRコードを生成</button>
    <button class="btn b3" onclick="cpTxt()">テキストをコピー</button>
    <button class="btn b2" onclick="doReset()">リセット</button>
  </div>
  <div class="qa" id="qrArea"></div>
</div>
<noscript><div style="padding:20px;text-align:center;color:#dc2626;font-weight:bold">

</div></noscript>

// ========== PATIENT STATE ==========
var patients=[];       // array of {id, name, wounds[], nextWoundId, remarks}
var currentPid=null;   // active patient id
var nextPatientId=1;

function createPatient(){
  var p={id:nextPatientId++, name:'', wounds:[], nextWoundId:1, remarks:''};
  p.wounds.push({id:p.nextWoundId++, site:'仙骨部', answers:{}});
  return p;
}
function curPatient(){for(var i=0;i<patients.length;i++){if(patients[i].id===currentPid)return patients[i];}return null;}

// Convenience accessors for current patient's wounds
function getWounds(){var p=curPatient();return p?p.wounds:[];}

function createWoundState(){var p=curPatient();if(!p)return{id:1,site:'仙骨部',answers:{}};return{id:p.nextWoundId++,site:'仙骨部',answers:{}};}

// ========== HELPERS ==========
function E(id){return document.getElementById(id);}
function Q(sel,ctx){return(ctx||document).querySelectorAll(sel);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function toast(msg){var t=E('tst');if(!t)return;t.textContent=msg;t.className='tst on';setTimeout(function(){t.className='tst';},1800);}

// ========== SCORE ==========
function calcWoundScore(wound){
  var total=0,answered=0,scorable=0;
  for(var i=0;i<SECTIONS.length;i++){
    var sec=SECTIONS[i];
    if(sec.countInScore){scorable++;var a=wound.answers[sec.id];if(a!==undefined){total+=a.score;answered++;}}
  }
  var depthAnswered=wound.answers['depth']!==undefined;
  var totalSections=SECTIONS.length;
  var totalAnswered=answered+(depthAnswered?1:0);
  return{total:total,answered:totalAnswered,totalSections:totalSections,complete:totalAnswered===totalSections,unanswered:totalSections-totalAnswered};
}

function buildNotation(wound){
  var keys=['depth','exudate','size','inflammation','granulation','necrotic','pocket'];
  var vals=[];for(var i=0;i<keys.length;i++){var a=wound.answers[keys[i]];vals.push(a?a.value:'—');}
  return vals[0]+'-'+vals[1]+vals[2]+vals[3]+vals[4]+vals[5]+vals[6];
}

function judgeScore(score){
  if(score===0)return{label:'治癒',cls:'j-gn',color:'var(--gn)'};
  if(score<=9)return{label:'軽症',cls:'j-yw',color:'var(--yw)'};
  if(score<=20)return{label:'中等症',cls:'j-or',color:'var(--or)'};
  return{label:'重症',cls:'j-rd',color:'var(--rd)'};
}

function getSizeBand(sec,area){
  if(area<=0)return sec.sizeBands[0];
  for(var i=1;i<sec.sizeBands.length;i++){
    if(sec.sizeBands[i].maxArea===null)return sec.sizeBands[i];
    if(area<sec.sizeBands[i].maxArea)return sec.sizeBands[i];
  }
  return sec.sizeBands[sec.sizeBands.length-1];
}

// ========== PATIENT TABS ==========
function renderPatientTabs(){
  var bar=E('ptabBar');var h='';
  for(var i=0;i<patients.length;i++){
    var p=patients[i];
    var label=p.name||(''+(i+1));
    var isOn=p.id===currentPid;
    h+='<button class="ptab'+(isOn?' on':'')+'" data-pid="'+p.id+'" onclick="switchPatient('+p.id+')">';
    h+='<span class="ptab-nm">'+esc(label)+'</span>';
    if(patients.length>1)h+='<span class="ptab-close" data-pid="'+p.id+'" onclick="event.stopPropagation();removePatient('+p.id+')">✕</span>';
    h+='</button>';
  }
  h+='<button class="ptab-add" onclick="addPatient()">＋</button>';
  bar.innerHTML=h;
}

function switchPatient(pid){
  saveCurrentToState();
  currentPid=pid;
  loadCurrentFromState();
  renderPatientTabs();
  renderAllWounds();
}

function saveCurrentToState(){
  var p=curPatient();if(!p)return;
  p.name=E('patientName').value;
  p.remarks=E('remarks').value;
}

function loadCurrentFromState(){
  var p=curPatient();if(!p)return;
  E('patientName').value=p.name;
  E('remarks').value=p.remarks;
  E('qrArea').innerHTML='';
}

function addPatient(){
  saveCurrentToState();
  var p=createPatient();
  patients.push(p);
  currentPid=p.id;
  loadCurrentFromState();
  renderPatientTabs();
  renderAllWounds();
  toast('患者'+(patients.length)+'を追加しました');
}

function removePatient(pid){
  if(patients.length<=1){toast('最後の患者タブは削除できません');return;}
  if(!confirm('この患者のデータをすべて削除しますか？'))return;
  var idx=-1;for(var i=0;i<patients.length;i++){if(patients[i].id===pid){idx=i;break;}}
  if(idx<0)return;
  patients.splice(idx,1);
  if(currentPid===pid){
    currentPid=patients[Math.min(idx,patients.length-1)].id;
    loadCurrentFromState();
  }
  renderPatientTabs();
  renderAllWounds();
  toast('患者を削除しました');
}

function bindNameSync(){
  E('patientName').addEventListener('input',function(){
    var p=curPatient();if(p)p.name=this.value;
    renderPatientTabs();
  });
  E('remarks').addEventListener('input',function(){
    var p=curPatient();if(p)p.remarks=this.value;
  });
}

// ========== RENDER ==========
function renderAllWounds(){
  var wounds=getWounds();
  var c=E('woundContainer');c.innerHTML='';
  for(var i=0;i<wounds.length;i++)c.innerHTML+=renderWoundCard(wounds[i],i);
  E('addWoundBtn').disabled=wounds.length>=MAX_WOUNDS;
  bindWoundEvents();updateTotals();
}

function renderWoundCard(wound,idx){
  var num=idx+1;
  var siteOpts='';for(var s=0;s<WOUND_SITES.length;s++){siteOpts+='<option value="'+esc(WOUND_SITES[s])+'"'+(wound.site===WOUND_SITES[s]?' selected':'')+'>'+esc(WOUND_SITES[s])+'</option>';}
  var h='<div class="wcard" data-wid="'+wound.id+'">';
  h+='<div class="wcard-hd"><span class="wnum">🩹 創 #'+num+'</span>';
  h+='<select class="w-site" data-wid="'+wound.id+'">'+siteOpts+'</select>';
  if(getWounds().length>1)h+='<button class="wcard-del" data-wid="'+wound.id+'">✕ 削除</button>';
  h+='</div><div class="wcard-body">';
  for(var i=0;i<SECTIONS.length;i++)h+=renderSection(SECTIONS[i],wound);
  h+='</div>';
  var sc=calcWoundScore(wound);var notation=buildNotation(wound);
  h+='<div class="wcard-foot">';
  h+='<span class="notation" id="notation-'+wound.id+'">'+esc(notation)+'</span>';
  h+='<span class="wscore" id="wscore-'+wound.id+'">'+sc.total+'点'+(sc.complete?'':'（未完了）')+'</span>';
  if(sc.complete){var j=judgeScore(sc.total);h+='<span class="jl '+j.cls+'" id="wjudge-'+wound.id+'">'+j.label+'</span>';}
  else{h+='<span id="wjudge-'+wound.id+'"></span>';}
  h+='</div></div>';
  return h;
}

function renderSection(sec,wound){
  var h='<div class="qsec"><div class="qsec-hd">';
  h+='<span class="qid">'+sec.id.charAt(0).toUpperCase()+'</span>';
  h+='<span class="qtitle">'+esc(sec.title)+'</span>';
  if(!sec.countInScore)h+='<span class="qsc">※合計点に含まず</span>';
  h+='</div>';
  if(sec.instruction)h+='<div class="qinst">'+esc(sec.instruction)+'</div>';
  if(sec.inputType==='single-select')h+=renderSelectOptions(sec,wound);
  else if(sec.inputType==='size-calculator')h+=renderSizeCalculator(sec,wound);
  h+='</div>';return h;
}

function renderSelectOptions(sec,wound){
  var ans=wound.answers[sec.id];
  var h='<div class="qopts">';
  for(var i=0;i<sec.options.length;i++){
    var opt=sec.options[i];var isOn=ans&&ans.value===opt.value;
    h+='<button class="qopt'+(isOn?' on':'')+'" data-wid="'+wound.id+'" data-sec="'+sec.id+'" data-val="'+esc(opt.value)+'" data-score="'+opt.score+'">';
    h+='<span class="badge">'+opt.score+'点</span>'+esc(opt.label)+'</button>';
  }
  h+='</div>';return h;
}

function renderSizeCalculator(sec,wound){
  var ans=wound.answers[sec.id];
  var mode=(ans&&ans.mode==='direct')?'direct':'calc';
  var wid=wound.id,sid=sec.id;
  var h='<div class="size-calc">';
  h+='<div class="size-tabs">';
  h+='<button class="size-tab'+(mode==='calc'?' on':'')+'" data-wid="'+wid+'" data-sec="'+sid+'" data-mode="calc">📏 cm入力</button>';
  h+='<button class="size-tab'+(mode==='direct'?' on':'')+'" data-wid="'+wid+'" data-sec="'+sid+'" data-mode="direct">🔢 直接選択</button>';
  h+='</div>';
  h+='<div id="szcalc-'+wid+'-'+sid+'" style="display:'+(mode==='calc'?'block':'none')+'">';
  if(sid==='pocket')h+='<div class="size-note" style="margin-bottom:8px">ポケット面積 = ポケット全周 − 褥瘤の大きさ（cm²）</div>';
  h+='<div class="size-input-row">';
  h+='<label>長径</label><input type="number" class="sz-long" data-wid="'+wid+'" data-sec="'+sid+'" step="0.1" min="0" placeholder="cm" value="'+(ans&&ans.long?ans.long:'')+'"><span>cm</span>';
  h+='<span style="margin:0 4px">×</span>';
  h+='<label>短径</label><input type="number" class="sz-short" data-wid="'+wid+'" data-sec="'+sid+'" step="0.1" min="0" placeholder="cm" value="'+(ans&&ans.short?ans.short:'')+'"><span>cm</span>';
  h+='</div>';
  var areaStr='';
  if(ans&&ans.area!==undefined&&ans.mode!=='direct')areaStr='→ '+ans.area.toFixed(1)+'cm² → '+ans.value+'（+'+ans.score+'点）';
  h+='<div class="size-result" id="szresult-'+wid+'-'+sid+'">'+areaStr+'</div></div>';
  h+='<div id="szdirect-'+wid+'-'+sid+'" style="display:'+(mode==='direct'?'block':'none')+'"><div class="qopts">';
  for(var i=0;i<sec.sizeBands.length;i++){
    var band=sec.sizeBands[i];var isOn=ans&&ans.value===band.value&&ans.mode==='direct';
    h+='<button class="qopt'+(isOn?' on':'')+'" data-wid="'+wid+'" data-sec="'+sid+'" data-val="'+esc(band.value)+'" data-score="'+band.score+'" data-direct="1">';
    h+='<span class="badge">'+band.score+'点</span>'+esc(band.label)+'</button>';
  }
  h+='</div></div></div>';
  return h;
}

// ========== EVENTS ==========
function bindWoundEvents(){
  var opts=Q('.qopt');for(var i=0;i<opts.length;i++){opts[i].addEventListener('click',function(){
    var wid=parseInt(this.getAttribute('data-wid'));var secId=this.getAttribute('data-sec');
    var val=this.getAttribute('data-val');var score=parseInt(this.getAttribute('data-score'));
    var isDirect=this.getAttribute('data-direct')==='1';
    var wound=findWound(wid);if(!wound)return;
    if(isDirect)wound.answers[secId]={value:val,score:score,mode:'direct'};
    else wound.answers[secId]={value:val,score:score};
    var sibs=this.parentNode.querySelectorAll('.qopt');for(var j=0;j<sibs.length;j++)sibs[j].className='qopt';
    this.className='qopt on';updateWoundFooter(wound);updateTotals();
  });}
  var sites=Q('.w-site');for(var i=0;i<sites.length;i++){sites[i].addEventListener('change',function(){
    var wid=parseInt(this.getAttribute('data-wid'));var wound=findWound(wid);if(wound){wound.site=this.value;updateTotals();}
  });}
  var dels=Q('.wcard-del');for(var i=0;i<dels.length;i++){dels[i].addEventListener('click',function(){
    var wid=parseInt(this.getAttribute('data-wid'));removeWound(wid);
  });}
  var sztabs=Q('.size-tab');for(var i=0;i<sztabs.length;i++){sztabs[i].addEventListener('click',function(){
    var wid=parseInt(this.getAttribute('data-wid'));var sid=this.getAttribute('data-sec');var mode=this.getAttribute('data-mode');
    var sibs=this.parentNode.querySelectorAll('.size-tab');for(var j=0;j<sibs.length;j++)sibs[j].className='size-tab';
    this.className='size-tab on';
    var calcDiv=E('szcalc-'+wid+'-'+sid);var directDiv=E('szdirect-'+wid+'-'+sid);
    if(mode==='calc'){calcDiv.style.display='block';directDiv.style.display='none';}
    else{calcDiv.style.display='none';directDiv.style.display='block';}
  });}
  var szInputs=Q('.sz-long,.sz-short');for(var i=0;i<szInputs.length;i++){szInputs[i].addEventListener('input',function(){
    var wid=parseInt(this.getAttribute('data-wid'));var sid=this.getAttribute('data-sec');
    calcSizeFromInputs(wid,sid);
  });}
}

function calcSizeFromInputs(wid,sid){
  var wound=findWound(wid);if(!wound)return;
  var sec=findSection(sid);if(!sec)return;
  var card=document.querySelector('.wcard[data-wid="'+wid+'"]');
  var longInput=card.querySelector('.sz-long[data-sec="'+sid+'"]');
  var shortInput=card.querySelector('.sz-short[data-sec="'+sid+'"]');
  var longVal=parseFloat(longInput.value);var shortVal=parseFloat(shortInput.value);
  var resultEl=E('szresult-'+wid+'-'+sid);
  if(isNaN(longVal)||isNaN(shortVal)||longVal<=0||shortVal<=0){
    if((longVal===0||isNaN(longVal))&&(shortVal===0||isNaN(shortVal))){
      var band=sec.sizeBands[0];wound.answers[sid]={value:band.value,score:band.score,area:0,long:'',short:'',mode:'calc'};resultEl.textContent='';
    }else{resultEl.textContent='';delete wound.answers[sid];}
    updateWoundFooter(wound);updateTotals();return;
  }
  var area=longVal*shortVal;var band=getSizeBand(sec,area);
  wound.answers[sid]={value:band.value,score:band.score,area:area,long:longVal,short:shortVal,mode:'calc'};
  resultEl.textContent='→ '+area.toFixed(1)+'cm² → '+band.value+'（+'+band.score+'点）';
  updateWoundFooter(wound);updateTotals();
}

function updateWoundFooter(wound){
  var sc=calcWoundScore(wound);var notation=buildNotation(wound);
  var notEl=E('notation-'+wound.id);var scoreEl=E('wscore-'+wound.id);var judgeEl=E('wjudge-'+wound.id);
  if(notEl)notEl.textContent=notation;
  if(scoreEl)scoreEl.textContent=sc.total+'点'+(sc.complete?'':'（未完了）');
  if(judgeEl){
    if(sc.complete){var j=judgeScore(sc.total);judgeEl.innerHTML='<span class="jl '+j.cls+'">'+j.label+'</span>';judgeEl.className='';}
    else{judgeEl.innerHTML='';}
  }
}

function updateTotals(){
  var wounds=getWounds();
  var grandTotal=0,allComplete=true,summH='';
  for(var i=0;i<wounds.length;i++){
    var sc=calcWoundScore(wounds[i]);grandTotal+=sc.total;if(!sc.complete)allComplete=false;
    var jc=sc.complete?judgeScore(sc.total):null;
    summH+='<div class="wsumm-item"><span class="wlbl">創#'+(i+1)+' '+esc(wounds[i].site)+'：</span>';
    summH+='<span class="wval">'+sc.total+'点</span>';
    if(jc)summH+=' <span class="jl '+jc.cls+'" style="font-size:.72rem">'+jc.label+'</span>';
    if(!sc.complete)summH+=' <span style="font-size:.72rem;color:var(--or)">（未完了）</span>';
    summH+='</div>';
  }
  E('woundSummary').innerHTML=summH;
  E('totalScore').innerHTML=grandTotal+'<span class="mx"> / 66点</span>';
  var pbar=E('totalBar');pbar.style.width=Math.min(100,grandTotal/66*100)+'%';
  if(allComplete&&wounds.length>0){
    var worstScore=0;for(var i=0;i<wounds.length;i++){var ws=calcWoundScore(wounds[i]);if(ws.total>worstScore)worstScore=ws.total;}
    var j=judgeScore(worstScore);pbar.style.background=j.color;
  }else{pbar.style.background=wounds.length>0?'var(--pr)':'var(--bd)';}
  E('totalJudge').innerHTML='';
}

// ========== WOUND MGMT ==========
function findWound(wid){var ws=getWounds();for(var i=0;i<ws.length;i++){if(ws[i].id===wid)return ws[i];}return null;}
function findSection(sid){for(var i=0;i<SECTIONS.length;i++){if(SECTIONS[i].id===sid)return SECTIONS[i];}return null;}
function addWound(){var p=curPatient();if(!p||p.wounds.length>=MAX_WOUNDS)return;p.wounds.push(createWoundState());renderAllWounds();var cards=Q('.wcard');if(cards.length>0)cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'start'});}
function removeWound(wid){var p=curPatient();if(!p)return;p.wounds=p.wounds.filter(function(w){return w.id!==wid;});renderAllWounds();}

// ========== QR ==========
function buildQRText(){
  var ws=getWounds();var lines=[];
  for(var i=0;i<ws.length;i++){
    var w=ws[i];var notation=buildNotation(w);var sc=calcWoundScore(w);
    lines.push(w.site+': '+notation+': '+sc.total+'点');
  }
  var txt='【褥瘤 DESIGN-R®2020】\r\n'+lines.join('\r\n');
  var rm=E('remarks').value;if(rm)txt+='\r\n備考：'+rm;
  return txt;
}

function countUnanswered(){var ws=getWounds();var un=0;for(var i=0;i<ws.length;i++){un+=calcWoundScore(ws[i]).unanswered;}return un;}

function genQR(){
  var ws=getWounds();if(ws.length===0){toast('創が追加されていません');return;}
  var txt=buildQRText();var un=countUnanswered();var area=E('qrArea');var h='';
  if(un>0)h+='<div class="qwn">⚠ 未回答の項目が'+un+'件あります。未回答項目は「—」で表示されます。</div>';
  h+='<div class="qw"><canvas id="qrCanvas"></canvas></div>';
  h+='<div style="margin-top:14px"><button class="btn b3" onclick="cpTxt()">テキストをコピー</button></div>';
  h+='<div class="qt" id="qrText">'+esc(txt)+'</div>';
  area.innerHTML=h;
  try{
    var qr=qrcode(0,'M');qr.addData(txt);qr.make();
    var mc=qr.getModuleCount(),cs=Math.max(4,Math.min(8,Math.floor(280/mc))),mg=cs*4,sz=mc*cs+mg*2;
    var cv=E('qrCanvas');cv.width=sz;cv.height=sz;
    var ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#000';
    for(var r=0;r<mc;r++)for(var c=0;c<mc;c++){if(qr.isDark(r,c))ctx.fillRect(mg+c*cs,mg+r*cs,cs,cs);}
  }catch(e){area.innerHTML+='<div style="color:var(--rd);margin-top:8px;font-size:.82rem">QRコード生成エラー: '+esc(e.message||String(e))+'</div>';}
}

function cpTxt(){
  var txt=buildQRText();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('コピーしました');},function(){fbCp(txt);});}
  else{fbCp(txt);}
}
function fbCp(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('コピーしました');}catch(e){toast('コピーに失敗しました');}document.body.removeChild(ta);}

// ========== RESET ==========
function doReset(){
  if(!confirm('この患者のデータ（全創・氏名・QR）をリセットしますか？'))return;
  var p=curPatient();if(!p)return;
  p.wounds=[];p.nextWoundId=1;p.name='';p.remarks='';
  E('patientName').value='';E('remarks').value='';E('qrArea').innerHTML='';
  p.wounds.push({id:p.nextWoundId++,site:'仙骨部',answers:{}});
  renderAllWounds();renderPatientTabs();toast('リセットしました');
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded',function(){
  var p=createPatient();patients.push(p);currentPid=p.id;
  renderPatientTabs();bindNameSync();renderAllWounds();
});

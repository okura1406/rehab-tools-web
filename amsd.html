<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>標準ディサースリア検査（AMSD）評価バッテリー</title>
<!-- ▼ ウェブ公開・オフライン対応のための追記（採点ロジックには影響しません） -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMSD">
<!-- ▲ 追記ここまで -->
<style>
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --border:#d8dee4;
  --text:#222;
  --muted:#6b7280;
  --accent:#2563eb;
  --accent-light:#dbeafe;
  --warn:#d97706;
  --danger:#dc2626;
  --ok:#059669;
  --section:#eff3f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;line-height:1.5;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0 0 10px;padding:10px 12px;background:var(--accent);color:#fff;border-radius:6px}
h2{font-size:16px;margin:18px 0 8px;padding:8px 10px;background:#1f2937;color:#fff;border-radius:4px}
h3{font-size:15px;margin:14px 0 6px;padding:6px 10px;background:var(--section);border-left:4px solid var(--accent);border-radius:2px}
h4{font-size:14px;margin:10px 0 4px;color:#374151}
.patient-bar{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.patient-bar label{font-weight:bold;white-space:nowrap}
.patient-bar input{flex:1;min-width:120px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:15px}
.patient-note{font-size:12px;color:var(--muted);width:100%}
/* タブ帯は画面の上に固定する（下までスクロールしてもタブを押せるようにするため）。
   タブは折り返さず横1列にして、入りきらない場合は横スクロールで送る */
.tabs{display:flex;flex-wrap:nowrap;gap:4px;border-bottom:2px solid var(--accent);margin-bottom:10px;
  position:sticky;top:0;z-index:50;background:var(--bg);padding-top:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;white-space:nowrap;padding:8px 14px;border:1px solid var(--border);border-bottom:none;background:#e5e7eb;cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;font-weight:bold}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-panel{display:none;background:var(--panel);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;padding:12px}
.tab-panel.active{display:block}
.question{border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:10px;background:#fafbfc}
.question .label{font-weight:bold;margin-bottom:6px;font-size:14px}
.question .instr{font-size:12px;color:var(--muted);margin-bottom:6px}
.options{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;user-select:none;transition:all .15s}
.opt:hover{border-color:var(--accent);background:var(--accent-light)}
.opt.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:bold}
.opt-sm{font-size:12px;padding:4px 8px;min-width:34px;text-align:center}
/* 発話特徴 重症度ボタン */
.feat-score-btn{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;user-select:none;transition:all .15s;font-weight:bold}
.feat-score-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.feat-score-btn.selected-0{background:#e5e7eb;color:#374151;border-color:#9ca3af}
.feat-score-btn.selected-1{background:#fef3c7;color:#92400e;border-color:var(--warn)}
.feat-score-btn.selected-2{background:#fed7aa;color:#7c2d12;border-color:#f97316}
.feat-score-btn.selected-3{background:#fee2e2;color:#991b1b;border-color:var(--danger)}
.trial-row{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.trial-row .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.trial-row input[type="number"]{width:80px;padding:5px 6px;border:1px solid var(--border);border-radius:3px;font-size:14px}
.trial-row input[type="text"]{width:80px;padding:5px 6px;border:1px solid var(--border);border-radius:3px;font-size:14px}
.rl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0}
.rl-row .rl-label{font-size:12px;font-weight:bold;min-width:60px}
.rl-opts{display:flex;gap:4px;flex-wrap:wrap}
.result-box{margin-top:6px;padding:6px 10px;background:var(--accent-light);border-radius:4px;font-size:13px;display:flex;flex-wrap:wrap;gap:10px}
.result-box .pill{background:#fff;padding:2px 8px;border-radius:12px;border:1px solid var(--accent)}
.nt-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.nt-row .tag{font-size:12px;color:var(--muted);margin-right:4px}
.feature-func{border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:10px;background:#fff}
.feature-func .ff-head{font-weight:bold;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* 発話特徴 各項目スコアボタン行 */
.feat-item-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--border)}
.feat-item-row:last-child{border-bottom:none}
.feat-item-name{font-size:13px;flex:1;min-width:160px}
.feat-item-btns{display:flex;gap:4px}
.feat-item-btn{padding:3px 9px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-weight:bold;user-select:none;transition:all .15s;min-width:32px;text-align:center}
.feat-item-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.feat-item-btn.score-0{background:#e5e7eb;color:#374151;border-color:#9ca3af}
.feat-item-btn.score-1{background:#fef3c7;color:#92400e;border-color:var(--warn)}
.feat-item-btn.score-2{background:#fed7aa;color:#7c2d12;border-color:#f97316}
.feat-item-btn.score-3{background:#fee2e2;color:#991b1b;border-color:var(--danger)}
.supp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.supp .tag{font-size:12px;color:var(--muted)}
.supp input[type="text"],.supp input[type="number"]{padding:5px;border:1px solid var(--border);border-radius:3px;width:90px;font-size:13px}
.supp select{padding:5px;border:1px solid var(--border);border-radius:3px;font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.btn{padding:8px 14px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-reset{background:#e5e7eb;color:#111}
.btn-copy{background:var(--ok);color:#fff}
.btn:active{opacity:.8}
.qr-area{margin-top:14px;padding:12px;background:#f9fafb;border:1px solid var(--border);border-radius:6px}
.qr-canvas{background:#fff;display:inline-block;padding:8px;border:1px solid var(--border)}
.qr-text{margin-top:10px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:4px;white-space:pre-wrap;font-family:-apple-system,monospace;font-size:12px;max-height:300px;overflow:auto}
.warn-box{margin-top:8px;padding:8px 10px;background:#fef3c7;border:1px solid var(--warn);border-radius:4px;color:#92400e;font-size:13px;display:none}
.warn-box.show{display:block}
.avg-display{margin-top:4px;padding:4px 8px;background:#e0e7ff;border-radius:3px;font-size:12px;font-weight:bold;display:inline-block}
.score-nt{color:var(--danger);font-weight:bold}
.rl-eval{display:flex;gap:12px;align-items:center;font-size:12px}
.toggle-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.toggle-row label{font-size:12px;display:inline-flex;align-items:center;gap:4px}
.divider{border-top:1px dashed var(--border);margin:12px 0}
.section-meta{font-size:12px;color:var(--muted);margin:-4px 0 6px 10px}
.speech-rate-calc{margin-top:8px;padding:10px;background:var(--accent-light);border-radius:4px;font-size:14px;font-weight:bold}
.age-criteria{margin-top:6px;padding:6px 10px;background:#fef9e7;border:1px solid var(--warn);border-radius:3px;font-size:13px;display:none}
.age-criteria.show{display:block}
.q-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eval-badge{background:var(--ok);color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:bold}
.eval-badge.nt{background:var(--danger)}
.eval-badge.pending{background:#9ca3af}
.stance-select{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.nasal-count{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nasal-count .tag{font-size:11px;color:var(--muted)}
.unavailable{background:#fee2e2!important;color:#991b1b!important}
.footer-note{font-size:11px;color:var(--muted);margin-top:20px;text-align:center;padding-bottom:20px}
/* 下書き自動保存の確認バナー（ベース仕様書 7-3） */
.draft-banner{background:#fff7ed;border:1px solid var(--warn);border-radius:6px;padding:10px;margin-bottom:10px}
.db-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.db-row:last-child{margin-bottom:0}
.db-msg{font-size:13px;color:#92400e;flex:1;min-width:180px}

@media (max-width:600px){
  .wrap{padding:8px}
  h1{font-size:16px}
  .tab-btn{padding:6px 10px;font-size:13px}
  .trial-row{grid-template-columns:1fr}
  .trial-row input[type="number"]{width:100%}
}
</style>
</head>

   評価基準
   ============================================================ */
function evalBreathingRate(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  // 0: 27回以上 または 9回以下
  if(v>=27||v<=9)return 0;
  // 1: 24-26回 または 10-12回
  if((v>=24&&v<=26)||(v>=10&&v<=12))return 1;
  // 2: 21-23回 または 13-15回
  if((v>=21&&v<=23)||(v>=13&&v<=15))return 2;
  // 3: 16-20回
  if(v>=16&&v<=20)return 3;
  return null;
}
function evalSecond(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v<3.0)return 0;
  if(v<6.0)return 1;
  if(v<10.0)return 2;
  return 3;
}
function evalADDK(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v<3.0)return 0;
  if(v<6.0)return 1;
  if(v<9.0)return 2;
  return 3;
}
function evalNasalLeak(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v>=5)return 0;
  if(v>=3)return 1;
  if(v>=1)return 2;
  if(v===0)return 3;
  return null;
}
function evalNasalLeak8(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v>=5)return 0;
  if(v>=3)return 1;
  if(v>=1)return 2;
  if(v===0)return 3;
  return null;
}
/* [修正1] ⑭口唇の閉鎖: 小さい方を採用、評価基準を正しく適用 */
function evalLipOpen(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v>=3)return 0;
  if(v>=1)return 1;
  if(v>0)return 2;
  if(v===0)return 3;
  return null;
}
/* [修正2] ⑲〜㉔交互反復速度: 評価基準を正確に実装 */
function evalDDK12(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v<1.0)return 1;
  if(v<2.0)return 2;
  return 3;
}
function evalDDK34(v){
  if(v===''||v==null||isNaN(v))return null;
  v=Number(v);
  if(v<2.0)return 1;
  if(v<3.0)return 2;
  if(v>=4.0)return 3;
  return 2;
}

/* ============================================================
   採用値決定ルール
   ============================================================ */
function pickHigh(a,b){
  const aOk=(a!==''&&a!=null&&!isNaN(Number(a)));
  const bOk=(b!==''&&b!=null&&!isNaN(Number(b)));
  if(aOk&&bOk)return Math.max(Number(a),Number(b));
  if(aOk)return Number(a);
  if(bOk)return Number(b);
  return null;
}
function pickLow(a,b){
  const aOk=(a!==''&&a!=null&&!isNaN(Number(a)));
  const bOk=(b!==''&&b!=null&&!isNaN(Number(b)));
  if(aOk&&bOk)return Math.min(Number(a),Number(b));
  if(aOk)return Number(a);
  if(bOk)return Number(b);
  return null;
}
function pickHighScore(a,b){
  /* [修正3] リセットバグ修正: nullのみ許可、数値以外は無視 */
  const aOk=(a!==null&&a!==undefined&&typeof a==='number'&&!isNaN(a));
  const bOk=(b!==null&&b!==undefined&&typeof b==='number'&&!isNaN(b));
  if(aOk&&bOk)return Math.max(a,b);
  if(aOk)return a;
  if(bOk)return b;
  return null;
}

function el(tag,cls,txt){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!=null)e.textContent=txt;
  return e;
}
function makeOptionBtns(values,current,onPick,opts){
  opts=opts||{};
  const wrap=el('div','options');
  values.forEach(v=>{
    const b=el('div','opt'+(opts.small?' opt-sm':''),v.label!=null?v.label:String(v));
    if(current===(v.value!==undefined?v.value:v))b.classList.add('selected');
    b.onclick=()=>{
      const val=(v.value!==undefined?v.value:v);
      onPick(current===val?null:val);
      render();
    };
    wrap.appendChild(b);
  });
  return wrap;
}
function makeNTRow(ntValue,onPick){
  const wrap=el('div','nt-row');
  wrap.appendChild(el('span','tag','特記：'));
  ['NT','NR','X'].forEach(code=>{
    const b=el('div','opt opt-sm',code);
    if(ntValue===code)b.classList.add('selected');
    b.onclick=()=>{ onPick(ntValue===code?null:code); render(); };
    wrap.appendChild(b);
  });
  return wrap;
}

  if(score===null||score===undefined){
    return el('span','eval-badge pending','評価：—');

  if(typeof score==='string'){

  return el('span','eval-badge','評価：'+score);
}

/* ============================================================
   数値入力欄の共通ハンドラ（v1.9）
   - 入力中: 値をstateに保存するだけ（render()しない）→ キーボード閉じない
   - Enter押下: render()して、次の入力欄(同ID)へフォーカス移動
   - フォーカスアウト(blur): render()して確定
   nextId: Enter押下時にフォーカスを移す次の入力欄のID。末尾の欄は null。
   ============================================================ */
function bindNumInput(input, onSet, nextId){
  // 入力中は値を裏で保存するだけ
  input.addEventListener('input', e=>{ onSet(e.target.value); });
  // Enterキー: 確定 → 次の欄へ
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      render();
      if(nextId){
        // renderで新しいDOMに置き換わっているので、IDで探して新しい要素にフォーカス
        setTimeout(()=>{
          const next=document.getElementById(nextId);
          if(next){ next.focus(); try{next.select();}catch(err){} }
        }, 0);
      }
    }
  });
  // フォーカスを外したら確定
  input.addEventListener('blur', ()=>{ render(); });
}

function setAutoFocus(inp1, inp2){}
function bindDeferredInput(input, onSet){ bindNumInput(input, onSet, null); }

function getAgeCriteria(age){
  if(age==null||isNaN(age))return null;
  if(age>=18&&age<=34)return{label:'青年（18〜34歳）',min:4.7,avg:5.8};
  if(age>=35&&age<=59)return{label:'中年（35〜59歳）',min:3.9,avg:5.7};
  if(age>=60)return{label:'老年（60歳以上）',min:3.2,avg:4.6};
  return null;
}

/* ============================================================
   汎用: 2回施行 + 数値入力 + 自動評価 + [修正4]自動フォーカス
   ============================================================ */
function makeNumericTrialQuestion(panel,qNo,title,state,evalFn,opts){
  opts=opts||{};
  const q=el('div','question');
  const th=el('div','q-title');
  th.appendChild(el('span','label',qNo+' '+title));
  let score=null, adopted=null;
  if(state.nt){
    score=state.nt;
  } else {
    if(opts.pickLow) adopted=pickLow(state.t1,state.t2);
    else adopted=pickHigh(state.t1,state.t2);
    if(adopted!==null) score=evalFn(adopted);
  }
  th.appendChild(evalBadge(score));
  q.appendChild(th);
  if(opts.instr) q.appendChild(el('div','instr',opts.instr));

  const g=el('div','supp');
  g.appendChild(el('span','tag','1回目：'));
  const i1=document.createElement('input'); i1.type='text'; i1.inputMode='decimal'; i1.value=state.t1; i1.style.width='90px';
  const id1=opts.idPrefix?opts.idPrefix+'-t1':null;
  const id2=opts.idPrefix?opts.idPrefix+'-t2':null;
  if(id1) i1.id=id1;
  if(state.nt){ i1.disabled=true; i1.classList.add('unavailable'); }
  g.appendChild(i1);
  if(opts.unit) g.appendChild(el('span','tag',opts.unit));
  g.appendChild(el('span','tag','2回目：'));
  const i2=document.createElement('input'); i2.type='text'; i2.inputMode='decimal'; i2.value=state.t2; i2.style.width='90px';
  if(id2) i2.id=id2;
  if(state.nt){ i2.disabled=true; i2.classList.add('unavailable'); }
  g.appendChild(i2);
  if(opts.unit) g.appendChild(el('span','tag',opts.unit));
  q.appendChild(g);

  // bindNumInput: Enter → 次欄 / blur → render
  bindNumInput(i1, v=>{ state.t1=v; state.nt=null; }, id2);
  bindNumInput(i2, v=>{ state.t2=v; state.nt=null; }, opts.nextAfterT2||null);

  if(adopted!==null){
    const r=el('div','result-box');
    r.appendChild(el('span','pill',`採用値：${adopted}${opts.unit||''} (${opts.pickLow?'低い方':'高い方'})`));
    if(typeof score==='number') r.appendChild(el('span','pill',`評価点：${score}/3`));
    q.appendChild(r);
  }
  q.appendChild(makeNTRow(state.nt,v=>{ state.nt=v; if(v){state.t1='';state.t2='';} }));
  if(opts.extra) opts.extra(q,state);
  panel.appendChild(q);
}

function computeScoreQ6(){
  const s=STATE.oseo.q6;
  if(s.nt)return{display:s.nt,score:s.nt,R:null,L:null};
  const R=pickHighScore(s.R_t1,s.R_t2);
  const L=pickHighScore(s.L_t1,s.L_t2);
  if(R===null&&L===null)return{display:null,score:null,R:null,L:null};
  const arr=[R,L].filter(v=>v!==null);
  const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
  return{display:`R:${R!==null?R:'—'} L:${L!==null?L:'—'} 平均:${avg.toFixed(1)}`,score:avg,R,L};
}
function computeScoreQ7(){
  const s=STATE.oseo.q7;
  if(s.nt)return{display:s.nt,score:s.nt};
  const R_adopted=pickLow(s.R_t1,s.R_t2);
  const L_adopted=pickLow(s.L_t1,s.L_t2);
  const R_eval=R_adopted!==null?evalNasalLeak(R_adopted):null;
  const L_eval=L_adopted!==null?evalNasalLeak(L_adopted):null;
  if(R_adopted===null&&L_adopted===null)return{display:null,score:null};
  const details=[];
  if(R_adopted!==null)details.push(`R採用:${R_adopted}度→評価${R_eval}`);
  if(L_adopted!==null)details.push(`L採用:${L_adopted}度→評価${L_eval}`);
  const arr=[R_eval,L_eval].filter(v=>v!==null);
  const avg=arr.length>0?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  return{display:avg!==null?`R:${R_eval!==null?R_eval:'—'} L:${L_eval!==null?L_eval:'—'} 平均:${avg.toFixed(1)}`:null,score:avg,R_eval,L_eval,R_adopted,L_adopted,details};
}
function computeScoreQ8(){

  const arr=[R_eval,L_eval].filter(v=>v!==null);

function computeOralAItemScore(item){
  const s=STATE.oseo[item.id];
  if(s.nt)return{display:s.nt,score:s.nt};
  if(item.type==='select'){
    const v=pickHighScore(s.t1,s.t2);
    return{display:v,score:v};
  } else {
    /* [修正1] ⑭: 小さい方を採用 */
    const adopted=pickLow(s.t1,s.t2);
    if(adopted===null)return{display:null,score:null};
    const ev=evalLipOpen(adopted);
    return{display:ev,score:ev};
  }
}
function computeOrganOralAAvg(){
  const items=[
    {id:'q9',type:'select'},{id:'q10',type:'select'},{id:'q11',type:'select'},

  const scores=items.map(it=>computeOralAItemScore(it).score).filter(s=>typeof s==='number');

}

/* 回数÷秒数 から 回/秒 を算出 */
function computeRate(count, sec){
  const c=Number(count), s=Number(sec);
  if(count===''||count==null||sec===''||sec==null)return null;
  if(isNaN(c)||isNaN(s)||s<=0)return null;
  return c/s;
}

function toCRLF(raw){ return raw.replace(/\r\n/g,'\n').replace(/\n/g,'\r\n'); }

function generateQR(){
  const parts=[
    {rawFn:buildQRPart1, areaId:'qr-area-1', canvasId:'qr-canvas-1', textId:'qr-text-1'},
    {rawFn:buildQRPart2, areaId:'qr-area-2', canvasId:'qr-canvas-2', textId:'qr-text-2'},
    {rawFn:buildQRPart3, areaId:'qr-area-3', canvasId:'qr-canvas-3', textId:'qr-text-3'}
  ];
  let firstArea=null;
  parts.forEach(p=>{
    const text=toCRLF(p.rawFn());
    const qrArea=document.getElementById(p.areaId);
    const qrCanvas=document.getElementById(p.canvasId);
    const qrText=document.getElementById(p.textId);
    qrCanvas.innerHTML=''; qrText.textContent=text;
    try{
      const qr=qrcode(0,'M');
      qr.addData(text);
      qr.make();
      qrCanvas.innerHTML=qr.createSvgTag(3,4);
    }catch(e){
      qrCanvas.innerHTML='<div style="color:red;padding:10px">QR生成エラー（テキストが長すぎる可能性があります）: '+e.message+'</div>';
    }
    qrArea.style.display='block';
    if(!firstArea)firstArea=qrArea;
  });
  // 下書き消去ボタンを表示する（QR生成だけでは自動消去しない：仕様書 7-4）
  const clearRow=document.getElementById('draft-clear-row');
  if(clearRow)clearRow.style.display='';
  if(firstArea){ try{firstArea.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){} }
}

function countUnanswered(){
  let n=0;
  if(STATE.mingryodo==null)n++;
  if(STATE.shizendo==null)n++;
  if(STATE.speechRate.a===''||STATE.speechRate.a==null)n++;
  const ids=['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10','q11','q12','q13','q14','q15','q16','q17','q18','q19','q20','q21','q22','q23','q24','q25','q26','q27','q28','q29'];
  ids.forEach(id=>{
    const s=STATE.oseo[id];
    if(s.nt)return;
    if(id==='q1'){
      if(s.t1===''||s.t1==null)n++;
    }else if(id==='q6'){
      if(s.R_t1==null&&s.L_t1==null&&s.R_t2==null&&s.L_t2==null)n++;
    }else if(id==='q7'||id==='q8'){
      if([s.R_t1,s.L_t1,s.R_t2,s.L_t2].every(v=>v===''||v==null))n++;
    }else if(['q19','q20','q21','q22','q23','q24'].includes(id)){
      if(!s.zero&&(s.t1===''||s.t1==null)&&(s.t2===''||s.t2==null))n++;
    }else if(['q9','q10','q11','q12','q13','q15','q16','q17','q18','q25','q26','q27','q28','q29'].includes(id)){
      if(s.t1==null&&s.t2==null)n++;
    }else{
      if((s.t1===''||s.t1==null)&&(s.t2===''||s.t2==null))n++;
    }
  });
  return n;
}

/* QR1: Ⅱ.発話の検査 */
function buildQRPart1(){
  const lines=[];
  lines.push('◆AMSD [1/3] Ⅱ.発話の検査');
  const mopt=MINGRYODO_OPTS.find(o=>o.value===STATE.mingryodo);
  lines.push(`1.発話明瞭度：${STATE.mingryodo!=null?STATE.mingryodo:'—'}/${mopt?mopt.label:'未回答'}`);
  const sopt=SHIZENDO_OPTS.find(o=>o.value===STATE.shizendo);
  lines.push(`2.発話の自然度：${STATE.shizendo!=null?STATE.shizendo:'—'}/${sopt?sopt.label:'未回答'}`);

  lines.push('3.発話特徴：');
  const funcs=[
    {key:'respiration',num:'①',name:'呼吸・発声機能'},
    {key:'velopharyngeal',num:'②',name:'鼻咽腔閉鎖機能'},
    {key:'articulation',num:'③',name:'口腔構音機能'},
    {key:'prosody',num:'④',name:'プロソディー機能'}
  ];
  funcs.forEach(f=>{
    const st=STATE.features[f.key];
    const f_def=FEATURES[f.key];
    const scored=f_def.items.filter(it=>(st.items[it]||0)>0);
    if(scored.length===0)return;
    const maxScore=f_def.items.reduce((mx,it)=>{ const v=st.items[it]||0; return v>mx?v:mx; },0);
    const itemDetails=scored.map(it=>`${it}(${st.items[it]})`).join('、');
    lines.push(`${f.num}${f.name}（最高スコア${maxScore}）：${itemDetails}`);
  });

  const a=Number(STATE.speechRate.a);
  const b_val=STATE.speechRate.b===''?0:Number(STATE.speechRate.b);
  const c_val=STATE.speechRate.c===''?0:Number(STATE.speechRate.c);
  let rate=null;
  if(STATE.speechRate.a!==''&&!isNaN(a)&&a>0) rate=(223+b_val-c_val)/a;
  const crit=getAgeCriteria(STATE.age);
  if(rate!==null){
    let line=`4.発話速度：${rate.toFixed(2)}モーラ/秒`;
    if(crit) line+=`（基準：${crit.label} ${crit.min}モーラ/秒以上、平均${crit.avg}）`;
    lines.push(line);
  }else lines.push('4.発話速度：—（未計測）');

  return lines.join('\n');
}

    const s14=STATE.oseo.q14;
    if(s14.nt)lines.push(`⑭口唇の閉鎖：${s14.nt}`);
    else{const adopted=pickLow(s14.t1,s14.t2);const ev=adopted!==null?evalLipOpen(adopted):null;lines.push(`⑭口唇の閉鎖：${adopted!==null?adopted:'—'}mm（評価${fmtScore(ev)}）`);}
    const ids2=['q15','q16','q17','q18'];
    const labels2={q15:'⑮口唇を引く',q16:'⑯口唇の突出',q17:'⑰下顎の下制',q18:'⑱下顎の挙上'};
    ids2.forEach(id=>{const s=STATE.oseo[id];if(s.nt)lines.push(`${labels2[id]}：${s.nt}`);else{const v=pickHighScore(s.t1,s.t2);lines.push(`${labels2[id]}：${v!==null?v:'—'}`);}});
    const q16=STATE.oseo.q16;
    if(q16.facialParalysis){const sides=Object.keys(q16.fp_side).filter(k=>q16.fp_side[k]).join('/');lines.push(`　顔面神経麻痺：${q16.facialParalysis}${sides?'('+sides+')':''}`);}
  }

  const bAvg=computeOrganOralBAvg();
  lines.push(`b.交互反復運動での速度（平均評価点：${bAvg.value!=null?bAvg.value.toFixed(1):'—'}）`);
  // ⑲〜㉔ 1項目1行
  {
    const items=[
      {id:'q19',label:'⑲舌突出－後退',fn:evalDDK12},
      {id:'q20',label:'⑳舌左右',fn:evalDDK12},
      {id:'q21',label:'㉑下顎挙上－下制',fn:evalDDK12},
      {id:'q22',label:'㉒/pa/',fn:evalDDK34},
      {id:'q23',label:'㉓/ta/',fn:evalDDK34},
      {id:'q24',label:'㉔/ka/',fn:evalDDK34}
    ];
    items.forEach(it=>{
      const s=STATE.oseo[it.id];
      if(s.nt){lines.push(`${it.label}：${s.nt}`);return;}
      if(s.zero){lines.push(`${it.label}：0回/秒（評価0）`);return;}
      const v=pickHigh(s.t1,s.t2);
      if(v===null){lines.push(`${it.label}：—`);return;}
      const ev=it.fn(v);
      lines.push(`${it.label}：${Number(v).toFixed(1)}回/秒（評価${fmtScore(ev)}）`);
    });
  }

  const cAvg=computeOrganOralCAvg();
  lines.push(`c.筋力（平均評価点：${cAvg.value!=null?cAvg.value.toFixed(1):'—'}）`);
  // ㉕〜㉙ 1項目1行
  {
    const items=[{id:'q25',label:'㉕下顎下制'},{id:'q26',label:'㉖下顎挙上'},{id:'q27',label:'㉗舌突出'},{id:'q28',label:'㉘舌面挙上'},{id:'q29',label:'㉙口唇閉鎖'}];
    items.forEach(it=>{const s=STATE.oseo[it.id];if(s.nt)lines.push(`${it.label}：${s.nt}`);else{const v=pickHighScore(s.t1,s.t2);lines.push(`${it.label}：${v!==null?v:'—'}`);}});
  }

  return lines.join('\n');
}


/* ============================================================
   リセット
   ============================================================ */
function resetAll(){
  // リセット時は、このタブが使っている下書きスロットも消去する（仕様書 7-4・8章）
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);
  STATE.patientName=''; STATE.age=null;
  STATE.mingryodo=null; STATE.shizendo=null;
  Object.keys(STATE.features).forEach(k=>{ STATE.features[k].items={}; });
  STATE.speechRate={a:'',b:'',c:''};
  Object.keys(STATE.oseo).forEach(k=>resetOseoItem(k));
}

function resetCurrentTab(){
  if(activeTab==='speech'){
    STATE.mingryodo=null; STATE.shizendo=null;
    Object.keys(STATE.features).forEach(k=>{ STATE.features[k].items={}; });
    STATE.speechRate={a:'',b:'',c:''};
  }else if(activeTab==='organ-resp') ['q1','q2','q3'].forEach(k=>resetOseoItem(k));
  else if(activeTab==='organ-voice') ['q4','q5'].forEach(k=>resetOseoItem(k));
  else if(activeTab==='organ-nasal') ['q6','q7','q8'].forEach(k=>resetOseoItem(k));
  else if(activeTab==='organ-oral-a') ['q9','q10','q11','q12','q13','q14','q15','q16','q17','q18'].forEach(k=>resetOseoItem(k));
  else if(activeTab==='organ-oral-b') ['q19','q20','q21','q22','q23','q24'].forEach(k=>resetOseoItem(k));
  else if(activeTab==='organ-oral-c') ['q25','q26','q27','q28','q29'].forEach(k=>resetOseoItem(k));
}

function resetOseoItem(k){
  const s=STATE.oseo[k];
  Object.keys(s).forEach(prop=>{
    if(prop==='stance') s.stance='座位';
    else if(prop==='paralysis'||prop==='facialParalysis') s[prop]='';
    else if(prop==='paralysis_side'||prop==='fp_side') s[prop]={R:false,L:false};
    else if(prop==='zero') s.zero=false;
    else if(prop==='nt') s.nt=null;
    /* [修正3] リセットバグ修正: 選択式(t1/t2)はnull、数値入力は空文字に正確に戻す */
    else if(prop==='t1'||prop==='t2'){
      // 選択式項目はnull、数値入力項目は空文字
      const numericItems=['q1','q2','q3','q4','q5','q7','q8','q14','q19','q20','q21','q22','q23','q24'];
      const rlItems=['q7','q8'];
      if(numericItems.includes(k)) s[prop]='';
      else s[prop]=null;
    }
    else if(prop==='nc1'||prop==='nc2'||prop==='R_t1'||prop==='L_t1'||prop==='R_t2'||prop==='L_t2') s[prop]='';
    else if(prop==='c1'||prop==='s1'||prop==='c2'||prop==='s2') s[prop]='';
  });
}

/* ============================================================
   下書き自動保存・復元（ベース仕様書 7章）
   - localStorage に独立した2スロット（A/B）を持つ。1タブ＝1スロット
   - sessionStorage・Cookie・外部送信は使用しない
   - 既存の下書きは自動復元せず、確認バナーで検査者に選ばせる
   - 消去は「QR生成後の消去ボタン」または「全タブをリセット」のときだけ
   ============================================================ */
var SLOT_KEYS={A:'amsdSave_slotA',B:'amsdSave_slotB',C:'amsdSave_slotC'};
/* 下書きの保存枠。共用端末で複数の患者を並行して扱えるようにするためのもの。
   枠を増減するときは、この配列と SLOT_KEYS を直すだけでよい（以下の処理は枠数に依存しない） */
var SLOTS=['A','B','C'];
var mySlot=null;          // このタブが書き込むスロット。決まるまでnull
var saveTimer=null;
var EMPTY_SNAPSHOT=JSON.stringify(STATE);   // 未入力状態の控え（空のまま保存しないため）

function readSlot(s){
  try{
    var raw=localStorage.getItem(SLOT_KEYS[s]);
    if(!raw)return null;
    var d=JSON.parse(raw);
    return (d&&d.s)?d:null;
  }catch(e){ return null; }
}
function writeSlot(s,d){ try{ localStorage.setItem(SLOT_KEYS[s],JSON.stringify(d)); }catch(e){} }
function clearSlot(s){ try{ localStorage.removeItem(SLOT_KEYS[s]); }catch(e){} }
function hasAnyInput(){ return JSON.stringify(STATE)!==EMPTY_SNAPSHOT; }

/* 入力のたびに呼ばれる。連続入力で書き込みが増えないよう400ms待ってからまとめて保存する */
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,400); }
function saveDraft(){
  if(!mySlot)return;                                   // スロット未確定（両方に下書きあり）の間は保存しない
  if(!hasAnyInput()){ clearSlot(mySlot); return; }      // 全部空なら下書きも残さない
  writeSlot(mySlot,{v:1,n:STATE.patientName,t:Date.now(),s:STATE});
}

/* 保存内容をSTATEへ書き戻す。STATE側にあるキーだけを上書きするので、
   古い版の下書きを読んでも新しい項目が消えない */
function mergeInto(dst,src){
  if(!src||typeof src!=='object')return;
  var keys=Object.keys(dst).length?Object.keys(dst):Object.keys(src);
  keys.forEach(function(k){
    var sv=src[k];
    if(sv===undefined)return;
    if(dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k])&&sv&&typeof sv==='object'&&!Array.isArray(sv)){
      mergeInto(dst[k],sv);
    }else{
      dst[k]=sv;
    }
  });
}

function fmtDraftTime(ts){
  var d=new Date(ts);
  function p(n){ return n<10?'0'+n:''+n; }
  return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* いま各枠に何が入っているかを調べる。used＝中身のある枠、free＝空いている枠 */
function computeDraftState(){
  var used=[],free=[];
  for(var i=0;i<SLOTS.length;i++){
    var s=SLOTS[i],d=readSlot(s);
    if(d)used.push({slot:s,d:d});else free.push(s);
  }
  return {used:used,free:free};
}
function refreshDraftBanner(){
  var st=computeDraftState();
  if(st.used.length===0){ hideDraftBanner(); if(!mySlot)mySlot=st.free.length?st.free[0]:null; return; }
  // 空きがあれば暫定的に割り当てる。空きが無ければ、検査者が選ぶまで保存を保留する
  mySlot=st.free.length?st.free[0]:null;
  showDraftBanner(st);
}
function draftRow(slot,d,no){
  var row=el('div','db-row');
  row.appendChild(el('span','db-msg',(no?no+'件目：':'')+'氏名 '+(d.n||'（未入力）')+'　最終更新 '+fmtDraftTime(d.t)));
  var go=el('button','btn btn-primary','続きから再開');
  go.onclick=function(){ resumeSlot(slot); };
  row.appendChild(go);
  var del=el('button','btn btn-reset','この下書きを削除');
  del.onclick=function(){
    if(!confirm('保存されている下書き（氏名：'+(d.n||'（未入力）')+'）を削除します。よろしいですか？'))return;
    clearSlot(slot); mySlot=null; refreshDraftBanner();
  };
  row.appendChild(del);
  return row;
}
function showDraftBanner(st){
  var box=document.getElementById('draftBanner');
  if(!box)return;
  box.innerHTML='';
  var wrap=el('div','draft-banner');
  wrap.appendChild(el('div','db-msg',
    '保存されている入力が'+st.used.length+'件あります。自動では復元しません。'
    +(st.free.length
      ? '（空きはあと'+st.free.length+'件。このまま新しい患者の入力を始められます）'
      : '空きがないため、いまのままでは入力が保存されません。下のいずれかを選んでください。')));
  for(var i=0;i<st.used.length;i++)wrap.appendChild(draftRow(st.used[i].slot,st.used[i].d,i+1));
  var foot=el('div','db-row');
  if(st.free.length){
    // 空きスロットがある場合のみ（仕様書 7-3）。既存の下書きには触れずにバナーを閉じる
    foot.appendChild(el('span','db-msg','これらを残したまま、別の患者の入力を始める場合：'));
    var keep=el('button','btn btn-reset','下書きは残して新規入力');
    keep.onclick=function(){ hideDraftBanner(); };
    foot.appendChild(keep);
  }
  if(st.used.length>1){
    var both=el('button','btn btn-reset','すべて破棄して新規入力');
    both.onclick=function(){
      if(!confirm('保存されている下書きをすべて破棄して新規入力にします。よろしいですか？'))return;
      for(var j=0;j<SLOTS.length;j++)clearSlot(SLOTS[j]);
      mySlot=null; refreshDraftBanner();
    };
    foot.appendChild(both);
  }
  if(foot.childNodes.length)wrap.appendChild(foot);
  box.appendChild(wrap);
}
function hideDraftBanner(){
  var box=document.getElementById('draftBanner');
  if(box)box.innerHTML='';
}
function resumeSlot(slot){
  var d=readSlot(slot);
  if(!d)return;
  mergeInto(STATE,d.s);
  mySlot=slot;
  hideDraftBanner();
  activeTab='speech';
  render();
}
function requestClearDraft(btn){
  if(!confirm('この端末に一時保存されている入力データ（下書き）を消去しますか？\n※表示中のQRコード・テキストはそのまま確認できます。'))return;
  clearTimeout(saveTimer);
  if(mySlot)clearSlot(mySlot);
  if(btn){ btn.disabled=true; btn.textContent='消去しました'; }
}

/* ============================================================
   初期化
   ============================================================ */
render();
refreshDraftBanner();
// 文字・数値の入力を拾う（選択ボタンは render() 経由で拾う）
document.addEventListener('input',scheduleSave,false);
// 選択肢を押すたびに render() が呼ばれるので、そこに保存処理を足す
render=(function(orig){ return function(){ orig.apply(null,arguments); scheduleSave(); }; })(render);
</script>

/* オフライン動作（Service Worker）の登録。
   登録に失敗しても catch で握りつぶすため、ツール本体の動作には影響しません。 */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

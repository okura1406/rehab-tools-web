<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>MDS-UPDRS 評価入力</title>
<!-- ▼ ウェブ公開・オフライン対応のための追記（採点ロジックには影響しません） -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MDS-UPDRS">
<!-- ▲ 追記ここまで -->
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f7f9fb;
  --ink:#17212e; --ink-2:#5a6675; --line:#d9e0e8; --line-2:#e8edf2;
  --primary:#2f5d8a; --chip-bg:#eef2f6;
  --s0:#2e7d5b; --s1:#6f9c3d; --s2:#c69122; --s3:#d1682e; --s4:#c0392b; --ur:#7a8595;
  --mild:#2e7d5b; --mod:#c69122; --sev:#c0392b;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 2px 8px rgba(20,30,45,.05);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}

header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.head-in{max-width:820px;margin:0 auto;padding:10px 12px}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title-row h1{font-size:17px;margin:0;letter-spacing:.02em}
.title-row .sub{font-size:11px;color:var(--ink-2)}
.hdr-toggle{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:8px;padding:5px 11px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.hdr-toggle .caret{display:inline-block;margin-right:4px;transition:transform .15s}
body.compact .hdr-toggle .caret{transform:rotate(-90deg)}
body.compact .pt-row,body.compact .totbar,body.compact .store-note{display:none}
.pt-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;color:var(--ink-2);font-weight:700;letter-spacing:.03em}
.field input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:15px;font-family:inherit;background:var(--surface-2);width:210px}
.pt-note{font-size:10px;color:var(--ink-2);background:var(--chip-bg);padding:4px 8px;border-radius:999px;align-self:center}
.store-note{font-size:10px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.mini-sum{display:none;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink-2)}
body.compact .mini-sum{display:flex}
.mini-sum .nm{font-weight:700;color:var(--ink);font-size:13px}
.mini-sum .sc{font-variant-numeric:tabular-nums;background:var(--chip-bg);border-radius:999px;padding:2px 9px;font-weight:700;color:var(--primary)}

.totbar{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tot{flex:1 1 0;min-width:96px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:6px 8px;text-align:center}
.tot .k{font-size:9.5px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.tot .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.tot .m{font-size:9.5px;color:var(--ink-2)}
.tot.grand{background:var(--primary);border-color:var(--primary)}
.tot.grand .k,.tot.grand .m{color:#cfe0f0} .tot.grand .v{color:#fff}

/* draft banner */
.banner{max-width:820px;margin:10px auto 0;padding:0 12px}
.banner-in{background:#fffaf0;border:1px solid #e8cf9a;border-left:4px solid var(--s2);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.banner-in h3{margin:0 0 3px;font-size:13px}
.banner-in .bd{font-size:11px;color:var(--ink-2);margin-bottom:9px}
.slot-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eddfc2}
.slot-row .info{font-size:12.5px;flex:1 1 200px}
.slot-row .info b{font-weight:700}
.slot-row .info .ts{color:var(--ink-2);font-size:11px}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.mini-btn.go{background:var(--primary);color:#fff;border-color:var(--primary)}
.mini-btn.del{color:var(--s4);border-color:#e3b5b0}
.banner-in .foot{margin-top:8px;border-top:1px solid #eddfc2;padding-top:9px}

.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px}
.tabs-in{max-width:820px;margin:0 auto;padding:0 12px;display:flex;gap:6px;overflow-x:auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:9px 14px;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .cnt{font-size:10px;font-weight:600;opacity:.85;margin-left:5px}

main{padding-top:12px}
.panel{display:none;animation:fade .18s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.grp-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.grp-h .bar{width:4px;height:16px;border-radius:2px;background:var(--primary)}
.grp-h h2{font-size:14px;margin:0;letter-spacing:.02em}
.note{font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin:0 0 10px}

.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden}
.item-h{display:flex;gap:9px;align-items:flex-start;padding:11px 12px 8px}
.num{flex:0 0 auto;background:var(--chip-bg);color:var(--primary);font-weight:800;font-size:12px;
  border-radius:7px;padding:3px 7px;font-variant-numeric:tabular-nums;min-width:38px;text-align:center;margin-top:1px}
.item-name{font-size:14.5px;font-weight:700;line-height:1.35}
.item-name .side{font-size:11px;font-weight:700;color:var(--ink-2);margin-left:6px;background:var(--surface-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:6px}
.item-name .inst{display:block;font-size:11px;font-weight:400;color:var(--ink-2);margin-top:2px}
.opts{padding:2px 10px 10px;display:flex;flex-direction:column;gap:5px}
.opt{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 9px;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink);line-height:1.4}
.opt:hover{border-color:#b9c6d4}
.opt .sc{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;background:var(--ur)}
.opt .lv{font-weight:700}
.opt[data-v="0"] .sc{background:var(--s0)} .opt[data-v="1"] .sc{background:var(--s1)}
.opt[data-v="2"] .sc{background:var(--s2)} .opt[data-v="3"] .sc{background:var(--s3)}
.opt[data-v="4"] .sc{background:var(--s4)} .opt[data-v="UR"] .sc{background:var(--ur);font-size:10px}
.opt.sel{background:#fff;border-width:2px;padding:7px 8px}
.opt.sel[data-v="0"]{border-color:var(--s0)} .opt.sel[data-v="1"]{border-color:var(--s1)}
.opt.sel[data-v="2"]{border-color:var(--s2)} .opt.sel[data-v="3"]{border-color:var(--s3)}
.opt.sel[data-v="4"]{border-color:var(--s4)} .opt.sel[data-v="UR"]{border-color:var(--ur)}
.opt.sel::after{content:"✓";margin-left:auto;font-weight:800;color:var(--primary);align-self:center}

.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 12px;margin:0 0 10px}
.rec .rl{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start}
.rec .rl .inst{display:block;font-size:11px;font-weight:400;color:var(--ink-2);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.sup{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.sup input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:14px;width:96px;font-family:inherit;background:var(--surface-2)}
.hy-list{margin-top:7px;font-size:11px;color:var(--ink-2);line-height:1.5}

/* progress + judgment */
.bar-out{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar-in{height:100%;background:var(--primary);border-radius:99px;transition:width .2s}
.judge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;background:var(--ur)}
.judge[data-j="mild"]{background:var(--mild)} .judge[data-j="mod"]{background:var(--mod)} .judge[data-j="sev"]{background:var(--sev)}
.judge[data-j="none"]{background:var(--ur)}

.subtot{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:12px 14px;margin:14px 0 6px}
.subtot .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.subtot .lab{font-size:12.5px;font-weight:700}
.subtot .num-big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--primary)}
.subtot .prog{font-size:11px;color:var(--ink-2);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warn{color:var(--s3);font-weight:700}

.sum-tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.sum-tbl td{padding:11px 13px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
.sum-tbl tr:last-child td{border-bottom:none}
.sum-tbl .p{font-weight:700}
.sum-tbl .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;white-space:nowrap}
.sum-tbl .g{text-align:right;font-size:11px;color:var(--ink-2);white-space:nowrap}
.sum-tbl .grand td{background:var(--primary);color:#fff}
.sum-tbl .grand .n{color:#fff;font-size:19px} .sum-tbl .grand .g{color:#cfe0f0}

.qr-sel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 13px;margin:16px 0 0}
.qr-sel .h{font-size:13px;font-weight:700;margin-bottom:3px}
.qr-sel .d{font-size:11px;color:var(--ink-2);margin-bottom:9px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.pchip .bx{width:17px;height:17px;border-radius:5px;border:1.5px solid #b9c6d4;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;line-height:1}
.pchip .n{font-weight:600;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.pchip.on{background:#fff;border-color:var(--primary);color:var(--primary)}
.pchip.on .bx{background:var(--primary);border-color:var(--primary)}
.pchip.on .bx::after{content:"✓"}
.qr-sel .none-warn{display:none;font-size:11.5px;color:var(--s4);font-weight:700;margin-top:8px}
.qr-sel.empty .none-warn{display:block}

.qr-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.btn{border:none;border-radius:10px;padding:12px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--s4);border:1px solid var(--s4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.unans-warn{display:none;background:#fff7ed;border:1px solid #e8cf9a;color:#8a6218;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
.unans-warn.show{display:block}
.qr-box{display:none;margin-top:12px}
.qr-box.show{display:block}
#qrcanvas{display:block;margin:0 auto;background:#fff;padding:14px;border:1px solid var(--line);border-radius:12px;image-rendering:pixelated}
.qr-cap{text-align:center;font-size:11px;color:var(--ink-2);margin-top:6px}
.erase-box{background:#fff7ed;border:1px solid #e8cf9a;border-radius:10px;padding:11px 12px;margin-top:14px}
.erase-box .t{font-size:12px;font-weight:700;margin-bottom:7px}
.erase-box .d{font-size:11px;color:var(--ink-2);margin-bottom:9px}
.qr-text-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;gap:8px}
.qr-text-h h3{font-size:13px;margin:0}
#qrtext{width:100%;min-height:230px;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--surface-2);color:var(--ink);resize:vertical;white-space:pre}
footer{max-width:820px;margin:22px auto 0;padding:0 14px;font-size:10.5px;color:var(--ink-2);line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="title-row">
      <h1 id="appTitle">評価尺度 入力ツール</h1>
      <span class="sub" id="appSub"></span>
      <button class="hdr-toggle" id="hdrToggle" type="button" aria-expanded="true">
        <span class="caret">▼</span><span class="tgl-lab">氏名・スコアを隠す</span>
      </button>
    </div>
    <div class="mini-sum" id="miniSum"></div>
    <div class="pt-row">
      <div class="field"><label>患者氏名</label><input id="ptName" type="text" placeholder="例）山田 太郎" autocomplete="off"></div>
      <span class="pt-note">氏名はQRコードには含まれません</span>
    </div>
    <div class="store-note">この端末に入力内容が一時保存されています。カルテ転記が完了したら、QR生成後に表示される消去ボタン、またはリセットで消去してください。<span id="slotTag"></span></div>
    <div class="totbar" id="totbar"></div>
  </div>
</header>

<div class="banner" id="banner" style="display:none"><div class="banner-in" id="bannerIn"></div></div>

<div class="tabs"><div class="tabs-in" id="tabbar" role="tablist"></div></div>
<main class="wrap" id="main"></main>

<footer id="foot"></footer>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// DENSO WAVE INCORPORATED

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {

              bytes.push(b);
            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

/* 重症度カットオフ（Martínez-Martín et al., Parkinsonism Relat Disord 2015;21:50-54） */
var CUTOFF={I:[10,21],II:[12,29],III:[32,58],IV:[4,12]};
var ROMAN={I:'Ⅰ',II:'Ⅱ',III:'Ⅲ',IV:'Ⅳ'};

var SCALES={
  updrs:{
    id:'updrs', name:'MDS-UPDRS', fullName:'MDS統一パーキンソン病評価スケール',
    maxScore:260, tabBySection:true, sections:UPDRS_SECTIONS,
    /* 仕様書 4-1：判定関数 */
    judgment:function(sectionId,score,complete){
      if(!complete||score==null) return {key:'none',label:'—'};
      var c=CUTOFF[sectionId]; if(!c) return {key:'none',label:'—'};
      if(score<=c[0]) return {key:'mild',label:'軽度'};
      if(score<=c[1]) return {key:'mod',label:'中等度'};
      return {key:'sev',label:'重度'};
    },
    /* 仕様書 4-1：QRテンプレート関数 */
    qrTemplate:function(st){
      var L=[],sel=st.parts;
      L.push('◆MDS-UPDRS 評価結果');
      if(sel.length<4) L.push('（記載Part：'+sel.map(function(p){return 'Part'+ROMAN[p];}).join('・')+'）');
      var grand=0,gAns=0,gTot=0;
      sel.forEach(function(p){
        var s=st.stats[p]; grand+=s.sum; gAns+=s.ans; gTot+=s.total;
        var sec=sectionById(p);
        L.push('【Part'+ROMAN[p]+' '+sec.short+'】小計'+(s.ans?s.sum:'—')+'/'+sec.maxScore
               +'（回答'+s.ans+'/'+s.total+(s.ur?(' UR'+s.ur):'')+'）'
               +(s.judge.key!=='none'?(' 判定:'+s.judge.label):''));
        var meta=st.meta[p]; if(meta) L.push(meta);
        L.push(st.lines[p]);
        var post=st.post[p]; if(post) L.push(post);
      });
      L.push('━━━━━━━━━━');
      var lab=(sel.length===4)?'合計スコア':('小計合算('+sel.map(function(p){return ROMAN[p];}).join('+')+')');
      L.push(lab+':'+(gAns>0?grand:'—')+'（'+gTot+'項目中'+gAns+'項目回答, UR除外）');
      return L.join('\n');
    }
  }
};

/* =====================================================================
   下書き自動保存（仕様書 7章）
   ===================================================================== */
var STORE_PREFIX='rating_tool_draft_';
var SLOTS=['A','B'];
var currentSlot=null;      // 未確定の間は保存しない
var saveTimer=null;

function slotKey(s){ return STORE_PREFIX+s; }
function readSlot(s){
  try{
    var raw=localStorage.getItem(slotKey(s)); if(!raw)return null;
    var o=JSON.parse(raw); if(!o||typeof o!=='object') return null;
    var filled=(o.name&&String(o.name).trim())?true:false;
    ['answers','supplements'].forEach(function(f){
      var g=o[f]||{}; Object.keys(g).forEach(function(k){ if(g[k]&&Object.keys(g[k]).length) filled=true; });
    });
    return filled?o:null;
  }catch(e){ return null; }
}
function writeSlot(s,data){ try{ localStorage.setItem(slotKey(s),JSON.stringify(data)); }catch(e){} }
function clearSlot(s){ try{ localStorage.removeItem(slotKey(s)); }catch(e){} }

function hasContent(){
  if(patientName&&patientName.trim()) return true;
  var any=false;
  Object.keys(SCALES).forEach(function(k){
    if(Object.keys(answers[k]||{}).length) any=true;
    if(Object.keys(supplements[k]||{}).length) any=true;
  });
  return any;
}
function saveDraft(){
  if(!currentSlot) return;
  /* 入力が空の間は下書きを作らない（次回起動時に空の復元バナーが出るのを防ぐ） */
  if(!hasContent()){ clearSlot(currentSlot); return; }
  writeSlot(currentSlot,{name:patientName,answers:answers,supplements:supplements,ts:Date.now()});
}
function scheduleSave(){
  if(!currentSlot) return;
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(saveDraft,400);
}
function fmtTime(ts){
  var d=new Date(ts), p=function(n){return (n<10?'0':'')+n;};
  var today=new Date(); var sameDay=d.toDateString()===today.toDateString();
  return (sameDay?'':(d.getMonth()+1)+'/'+d.getDate()+' ')+p(d.getHours())+':'+p(d.getMinutes());
}
function assignFreeSlot(){
  for(var i=0;i<SLOTS.length;i++){ if(!readSlot(SLOTS[i])){ currentSlot=SLOTS[i]; saveDraft(); updateSlotTag(); return; } }
  currentSlot=null; updateSlotTag();
}
function updateSlotTag(){
  var t=document.getElementById('slotTag');
  t.textContent = currentSlot ? ('（保存先：スロット'+currentSlot+'）')
    : '（保存スロットが空くまで一時保存は行われません。3人以上の同時入力は端末を分けてください）';
}
function initDrafts(){
  var existing=SLOTS.filter(function(s){ return !!readSlot(s); });
  if(existing.length===0){ assignFreeSlot(); return; }
  /* 自動復元はしない（7-3）。ただし空きスロットがあれば
     このタブの新規入力用に割り当てる（別患者の並行入力に対応） */
  assignFreeSlot();
  showBanner(existing);
}
function showBanner(list){
  var b=document.getElementById('banner'), box=document.getElementById('bannerIn');
  box.innerHTML='';
  box.appendChild(mk('h3',null,'保存されている入力があります'));
  box.appendChild(mk('div','bd','自動では復元しません。続きから再開するか、削除するかを選んでください。'));
  list.forEach(function(s){
    var d=readSlot(s); if(!d)return;
    var row=mk('div','slot-row');
    var info=mk('div','info');
    info.innerHTML='<b>スロット'+s+'</b>　氏名：'+(d.name?escapeHtml(d.name):'（未入力）')
      +'　<span class="ts">最終更新：'+fmtTime(d.ts)+'</span>';
    row.appendChild(info);
    var go=mk('button','mini-btn go','続きから再開'); go.type='button';
    go.addEventListener('click',function(){ restoreSlot(s); });
    var del=mk('button','mini-btn del','この下書きを削除'); del.type='button';
    del.addEventListener('click',function(){
      if(!confirm('スロット'+s+'の下書きを削除します。よろしいですか？')) return;
      clearSlot(s);
      var rest=SLOTS.filter(function(x){ return !!readSlot(x); });
      if(rest.length===0){ hideBanner(); assignFreeSlot(); }
      else showBanner(rest);
    });
    row.appendChild(go); row.appendChild(del);
    box.appendChild(row);
  });
  var foot=mk('div','foot');
  if(currentSlot){
    var keep=mk('button','mini-btn','下書きは残して新規入力'); keep.type='button';
    keep.addEventListener('click',function(){ hideBanner(); });
    foot.appendChild(keep);
  }
  if(list.length>1){
    var both=mk('button','mini-btn del','両方とも破棄して新規入力'); both.type='button';
    both.style.marginLeft='6px';
    both.addEventListener('click',function(){
      if(!confirm('両方の下書きを破棄して新規入力にします。よろしいですか？')) return;
      SLOTS.forEach(clearSlot); hideBanner(); assignFreeSlot();
    });
    foot.appendChild(both);
  }
  if(foot.childNodes.length) box.appendChild(foot);
  b.style.display='';
}
function hideBanner(){ document.getElementById('banner').style.display='none'; }
function restoreSlot(s){
  var d=readSlot(s); if(!d)return;
  patientName=d.name||'';
  document.getElementById('ptName').value=patientName;
  Object.keys(SCALES).forEach(function(k){
    answers[k]=(d.answers&&d.answers[k])?d.answers[k]:{};
    supplements[k]=(d.supplements&&d.supplements[k])?d.supplements[k]:{};
  });
  currentSlot=s; updateSlotTag(); hideBanner();
  buildPanels(); activate(getActiveTab()); updateAll();
}

function mk(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function getA(qid){ return answers[SCALE.id][qid]; }

function renderCard(qq){
  var card=mk('div','item');
  var h=mk('div','item-h');
  h.appendChild(mk('span','num',qq.num));
  h.appendChild(mk('div','item-name', escapeHtml(qq.label)+(qq.side?('<span class="side">'+escapeHtml(qq.side)+'</span>'):'')));
  card.appendChild(h);
  var wrap=mk('div','opts');
  qq.options.forEach(function(o){
    var val=String(o.value);
    var b=mk('button','opt','<span class="sc">'+escapeHtml(val)+'</span><span><span class="lv">'+escapeHtml(o.label)+'</span>　'+escapeHtml(o.desc||'')+'</span>');
    b.type='button'; b.setAttribute('data-v',val);
    if(getA(qq.id)!=null&&String(getA(qq.id))===val) b.classList.add('sel');
    b.addEventListener('click',function(){
      var cur=getA(qq.id);
      var next=(cur!=null&&String(cur)===val)?undefined:(o.value==='UR'?'UR':o.value);
      setA(qq.id,next);
      wrap.querySelectorAll('.opt').forEach(function(x){
        x.classList.toggle('sel', getA(qq.id)!=null&&String(getA(qq.id))===x.getAttribute('data-v'));
      });
      updateAll();
    });
    wrap.appendChild(b);
  });
  card.appendChild(wrap);
  return card;
}
function renderInline(qq){
  var box=mk('div','rec');
  var rl=mk('div','rl');
  if(qq.num) rl.appendChild(mk('span','num',qq.num));
  rl.appendChild(mk('span',null,escapeHtml(qq.label)+(qq.instruction?('<span class="inst">'+escapeHtml(qq.instruction)+'</span>'):'')));
  box.appendChild(rl);
  if(qq.options.length){
    var seg=mk('div','seg');
    qq.options.forEach(function(o){
      var b=mk('button',null,escapeHtml(o.label)); b.type='button';
      if(getA(qq.id)===o.value) b.classList.add('on');
      b.addEventListener('click',function(){
        setA(qq.id, getA(qq.id)===o.value?undefined:o.value);
        seg.querySelectorAll('button').forEach(function(x,i){ x.classList.toggle('on', getA(qq.id)===qq.options[i].value); });
        updateAll();
      });
      seg.appendChild(b);
    });
    box.appendChild(seg);
  }
  if(qq.supplementInput){
    var sup=mk('div','sup');
    if(qq.id==='h4_wake'){
      sup.appendChild(mk('span',null,'覚醒(h)')); sup.appendChild(numField(qq.id+'_wake'));
      sup.appendChild(mk('span',null,'ジスキネジア(h)')); sup.appendChild(numField(qq.id+'_dysk'));
      sup.appendChild(mk('span',null,'オフ(h)')); sup.appendChild(numField(qq.id+'_off'));
      var pct=mk('span','pct'); pct.id='pctCalc'; sup.appendChild(pct);
    }else{
      sup.appendChild(numField(qq.id+'_sup'));
      sup.appendChild(mk('span',null,escapeHtml(qq.supLabel||'')));
    }
    box.appendChild(sup);
  }
  if(qq.extraNote) box.appendChild(mk('div','hy-list',escapeHtml(qq.extraNote)));
  return box;
}
function numField(key){
  var i=mk('input'); i.type='number'; i.inputMode='decimal'; i.style.width='84px';
  if(getS(key)!=null) i.value=getS(key);
  i.addEventListener('input',function(){ setS(key, i.value===''?undefined:i.value); updatePct(); });
  return i;
}
function updatePct(){
  var e=document.getElementById('pctCalc'); if(!e)return;
  var w=parseFloat(getS('h4_wake_wake')), dy=parseFloat(getS('h4_wake_dysk')), of=parseFloat(getS('h4_wake_off'));
  var out=[];
  if(w>0&&!isNaN(dy)) out.push('ジスキネジア '+Math.round(dy/w*100)+'%');
  if(w>0&&!isNaN(of)) out.push('オフ '+Math.round(of/w*100)+'%');
  e.textContent=out.length?('→ '+out.join(' ／ ')):'';
}

  eb.appendChild(mk('div','t','カルテ転記は完了しましたか？'));
  eb.appendChild(mk('div','d','QRを生成しただけでは、この端末に一時保存された入力内容は消えません。転記が終わったら消去してください。'));
  var ebtn=mk('button','btn danger','入力データを消去する'); ebtn.type='button'; ebtn.addEventListener('click',resetAll);
  eb.appendChild(ebtn); qb.appendChild(eb);
  var th=mk('div','qr-text-h'); th.appendChild(mk('h3',null,'QRに含まれるテキスト'));
  var cb=mk('button','btn ghost','テキストをコピー'); cb.type='button'; cb.id='copyBtn';
  cb.style.padding='7px 12px'; cb.style.fontSize='12px'; cb.addEventListener('click',copyText);
  th.appendChild(cb); qb.appendChild(th);
  var ta=mk('textarea'); ta.id='qrtext'; ta.readOnly=true; qb.appendChild(ta);
  ps.appendChild(qb);
  return ps;
}
function buildQRSelector(){
  var box=mk('div','qr-sel'); box.id='qrSel';
  box.appendChild(mk('div','h','QRコードに含めるPart'));
  box.appendChild(mk('div','d','必要なPartだけを選んでQR化できます。選んでいないPartは出力されません。'));
  var chips=mk('div','chips');
  SCALE.sections.forEach(function(sec){
    var p=sec.id;
    var b=mk('button','pchip'); b.type='button'; b.setAttribute('data-part',p);
    b.innerHTML='<span class="bx"></span><span>Part '+ROMAN[p]+'</span><span class="n" data-cnt="'+p+'"></span>';
    if(qrParts[p]) b.classList.add('on');
    b.setAttribute('aria-pressed',qrParts[p]?'true':'false');
    b.addEventListener('click',function(){
      qrParts[p]=!qrParts[p];
      b.classList.toggle('on',qrParts[p]);
      b.setAttribute('aria-pressed',qrParts[p]?'true':'false');
      refreshSelector();
      if(document.getElementById('qrBox').classList.contains('show')) generateQR();
    });
    chips.appendChild(b);
  });
  box.appendChild(chips);
  box.appendChild(mk('div','none-warn','Partが1つも選ばれていません。1つ以上選んでください。'));
  return box;
}
function selectedParts(){ return SCALE.sections.map(function(s){return s.id;}).filter(function(p){return qrParts[p];}); }
function refreshSelector(){
  var box=document.getElementById('qrSel'); if(!box)return;
  box.classList.toggle('empty',selectedParts().length===0);
  SCALE.sections.forEach(function(sec){
    var n=box.querySelector('[data-cnt="'+sec.id+'"]'); if(!n)return;
    var st=statsOf(sec.id); n.textContent=st.ans+'/'+st.total;
  });
  var g=document.getElementById('genBtn'); if(g) g.disabled=(selectedParts().length===0);
}

/* =====================================================================
   集計・判定
   ===================================================================== */
function statsOf(secId){
  var sec=sectionById(secId), qs=scoredQs(sec);
  var sum=0,ans=0,ur=0;
  qs.forEach(function(x){ var v=getA(x.id); if(v==null)return; ans++; if(v==='UR')ur++; else sum+=v; });
  var complete=(ans===qs.length);
  return {sum:sum,ans:ans,ur:ur,total:qs.length,complete:complete,max:sec.maxScore,
          judge:SCALE.judgment(secId,sum,complete)};
}
function updateAll(){
  var grand=0,gAns=0,gTot=0,html='';
  SCALE.sections.forEach(function(sec){
    var st=statsOf(sec.id); grand+=st.sum; gAns+=st.ans; gTot+=st.total;
    var nEl=document.getElementById('sub-'+sec.id);
    if(nEl) nEl.textContent=(st.ans>0?st.sum:'—');
    var pEl=document.getElementById('prog-'+sec.id);
    if(pEl){
      var miss=st.total-st.ans;
      pEl.innerHTML='<span class="judge" data-j="'+st.judge.key+'">'+escapeHtml(st.judge.label)+'</span>'
        +'<span>回答 '+st.ans+'/'+st.total+(st.ur?('・UR '+st.ur):'')+'</span>'
        +(miss?('<span class="warn">未回答 '+miss+'（0点として計算していません）</span>'):'<span>満点 '+st.max+'</span>');
    }
    var bEl=document.getElementById('bar-'+sec.id);
    if(bEl) bEl.style.width=Math.round(st.ans/st.total*100)+'%';
    var tEl=document.querySelector('.tab[data-tab="'+sec.id+'"] .cnt');
    if(tEl) tEl.textContent=st.ans+'/'+st.total;
    html+='<div class="tot"><div class="k">Part'+ROMAN[sec.id]+'</div><div class="v">'+(st.ans>0?st.sum:'—')+'</div><div class="m">'+st.ans+'/'+st.total+'</div></div>';
  });
  html+='<div class="tot grand"><div class="k">合計</div><div class="v">'+(gAns>0?grand:'—')+'</div><div class="m">'+gAns+'/'+gTot+'</div></div>';
  document.getElementById('totbar').innerHTML=html;
  var ms=document.getElementById('miniSum');
  var mh=''; if(patientName) mh+='<span class="nm">'+escapeHtml(patientName)+'</span>';
  mh+='<span class="sc">合計 <b>'+(gAns>0?grand:'—')+'</b></span><span>回答 '+gAns+'/'+gTot+'</span>';
  ms.innerHTML=mh;
  renderSummary();
  refreshSelector();
}
function renderSummary(){
  var tbl=document.getElementById('sumTbl'); if(!tbl)return;
  var grand=0,gAns=0,gTot=0,html='';
  SCALE.sections.forEach(function(sec){
    var st=statsOf(sec.id); grand+=st.sum; gAns+=st.ans; gTot+=st.total;
    html+='<tr><td class="p">Part '+ROMAN[sec.id]+'（'+escapeHtml(sec.short)+'）<br>'
      +'<span class="judge" data-j="'+st.judge.key+'">'+escapeHtml(st.judge.label)+'</span></td>'
      +'<td class="n">'+(st.ans>0?st.sum:'—')+'<span style="font-size:11px;color:var(--ink-2)"> /'+st.max+'</span></td>'
      +'<td class="g">回答 '+st.ans+'/'+st.total+(st.ur?('<br>UR '+st.ur):'')+'</td></tr>';
  });
  html+='<tr class="grand"><td class="p">合計スコア</td><td class="n">'+(gAns>0?grand:'—')
    +'<span style="font-size:11px"> /'+SCALE.maxScore+'</span></td><td class="g">'+gAns+'/'+gTot+' 項目</td></tr>';
  tbl.innerHTML=html;
  var w=document.getElementById('unansWarn');
  if(w){
    var miss=gTot-gAns;
    w.classList.toggle('show',miss>0);
    w.textContent='未回答が '+miss+' 項目あります。未回答は0点として扱わず、QRにも「—」と出力されます（このままQR生成もできます）。';
  }
}

/* =====================================================================
   QR
   ===================================================================== */
function ansOf(qid){ var v=getA(qid); return v==null?'—':v; }
function buildState(){
  var sel=selectedParts(), stats={},lines={},meta={},post={};
  sel.forEach(function(p){
    stats[p]=statsOf(p);
    var sec=sectionById(p);
    lines[p]=scoredQs(sec).map(function(x){ return x.num+(x.side?('('+x.side+')'):'')+':'+ansOf(x.id); }).join(' ');
    if(p==='I') meta[p]='情報源:'+ansOf('info_IA')+' 質問票記入:'+ansOf('info_IB');
    if(p==='III'){
      var min=getS('p3_ldopa_sup'), ld=getA('p3_ldopa');
      meta[p]='状態:'+ansOf('p3_state')+' 投薬:'+ansOf('p3_med')+' Lドパ:'+ansOf('p3_ldopa')+((ld!=null&&min)?('(最終服用から'+min+'分)'):'');
      post[p]='付随) H&Y:'+ansOf('p3_hy')+' ジスキネジア出現:'+ansOf('p3_dysk')+' 影響:'+ansOf('p3_dysk_eff');
    }
  });
  return {parts:sel,stats:stats,lines:lines,meta:meta,post:post};
}
function generateQR(){
  if(selectedParts().length===0){ refreshSelector(); alert('QRコードに含めるPartを1つ以上選んでください。'); return; }
  var text=SCALE.qrTemplate(buildState());
  document.getElementById('qrtext').value=text;
  var qr=null, levels=['M','L','Q','H'];
  for(var i=0;i<levels.length&&!qr;i++){
    try{ var t=qrcode(0,levels[i]); t.addData(text); t.make(); qr=t; }catch(e){ qr=null; }
  }
  var box=document.getElementById('qrBox'); box.classList.add('show');
  if(!qr){ alert('QRの生成に失敗しました。含めるPartを減らすか、テキストのコピー機能をご利用ください。'); return; }
  drawQR(qr);
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function drawQR(qr){
  var n=qr.getModuleCount(),quiet=4,target=340;
  var scale=Math.max(2,Math.floor(target/(n+quiet*2)));
  var size=(n+quiet*2)*scale;
  var cv=document.getElementById('qrcanvas'); cv.width=size; cv.height=size;
  var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size); ctx.fillStyle='#000';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
  cv.style.width=Math.min(size,360)+'px'; cv.style.height=Math.min(size,360)+'px';
}
function copyText(){
  var ta=document.getElementById('qrtext'); ta.select(); ta.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); }catch(e){}
  if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});
  var b=document.getElementById('copyBtn'), old=b.textContent;
  b.textContent='コピーしました'; setTimeout(function(){ b.textContent=old; },1500);
}

/* =====================================================================
   リセット（仕様書 8章：下書きスロットも消去）
   ===================================================================== */
function resetAll(){
  if(!confirm('全ての回答・QR・氏名を消去します。この端末に一時保存された下書きも削除されます。よろしいですか？')) return;
  Object.keys(SCALES).forEach(function(k){ answers[k]={}; supplements[k]={}; });
  patientName=''; document.getElementById('ptName').value='';
  if(currentSlot) clearSlot(currentSlot);
  qrParts={I:true,II:true,III:true,IV:true};
  var box=document.getElementById('qrBox'); if(box){ box.classList.remove('show'); document.getElementById('qrtext').value=''; }
  var keep=getActiveTab();
  buildPanels(); activate(keep); updateAll();
  if(!currentSlot) assignFreeSlot(); else saveDraft();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =====================================================================
   タブ（仕様書 4-3：SCALES から自動生成）
   ===================================================================== */
function buildTabs(){
  var bar=document.getElementById('tabbar'); bar.innerHTML='';
  var keys=Object.keys(SCALES), multi=keys.length>1;
  keys.forEach(function(k){
    var sc=SCALES[k];
    if(sc.tabBySection){
      sc.sections.forEach(function(sec){
        bar.appendChild(tabBtn(sec.id,(multi?sc.name+' ':'')+sec.tabLabel,true));
      });
    }else{
      bar.appendChild(tabBtn(sc.id,sc.name,true));
    }
  });
  bar.appendChild(tabBtn('SUM','スコア・QR',false));
  document.getElementById('appTitle').textContent=SCALE.name+' 評価入力';
  document.getElementById('appSub').textContent=SCALE.fullName+' ／ Part Ⅰ–Ⅳ';
}
function tabBtn(id,label,withCount){
  var b=mk('button','tab',escapeHtml(label)+(withCount?' <span class="cnt"></span>':''));
  b.type='button'; b.setAttribute('role','tab'); b.setAttribute('data-tab',id); b.setAttribute('aria-selected','false');
  b.addEventListener('click',function(){ activate(id); });
  return b;
}
function activate(tab){
  var found=document.getElementById('panel-'+tab); if(!found) tab=SCALE.sections[0].id;
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected',b.getAttribute('data-tab')===tab?'true':'false'); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  var pn=document.getElementById('panel-'+tab); if(pn) pn.classList.add('active');
  if(tab==='SUM') renderSummary();
  window.scrollTo({top:0});
}
function getActiveTab(){ var s=document.querySelector('.tab[aria-selected="true"]'); return s?s.getAttribute('data-tab'):SCALE.sections[0].id; }

/* =====================================================================
   起動
   ===================================================================== */
document.getElementById('hdrToggle').addEventListener('click',function(){
  var c=document.body.classList.toggle('compact');
  this.setAttribute('aria-expanded',c?'false':'true');
  this.querySelector('.tgl-lab').textContent=c?'氏名・スコアを表示':'氏名・スコアを隠す';
});
document.getElementById('ptName').addEventListener('input',function(){
  patientName=this.value; updateAll(); scheduleSave();
});
document.getElementById('foot').innerHTML=
 'MDS-UPDRS（© International Parkinson and Movement Disorder Society 2008）に基づく入力補助ツール。合計点は各Partの評価点の総和で、UR（評価不能）項目は集計から除外します。'
+'Hoehn &amp; Yahr は参考記録で合計には含みません。<br>'
+'判定ラベルの基準値は Martínez-Martín P, et al. Parkinsonism Relat Disord 2015;21:50-54（PartⅠ 10/11・21/22、PartⅡ 12/13・29/30、PartⅢ 32/33・58/59、PartⅣ 4/5・12/13）に基づく参考表示で、全項目に回答した場合のみ表示されます。臨床判断は検査者が行ってください。<br>'
+'完全オフライン動作。入力内容は復旧目的で端末内 localStorage の下書きスロットにのみ一時保存し、Cookie・sessionStorage・外部送信は使用しません。';

buildTabs();
buildPanels();
activate(SCALE.sections[0].id);
initDrafts();
updateAll();
</script>
